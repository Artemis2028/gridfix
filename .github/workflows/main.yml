name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.20 (graphics GeoJSON, notification permission, recording failures visible) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.20-2d782b8acb0f" ]; then
            echo "payload v0.9.20-2d782b8acb0f already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 48
                  versionName = "0.9.20"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
              // org.json ships in android.jar as a stub that returns defaults under
              // isReturnDefaultValues, so a JVM test cannot parse its own output
              // without the real artifact on the test classpath ahead of it.
              testImplementation("org.json:json:20240303")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/UserMaps.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import kotlinx.coroutines.flow.StateFlow

          /**
           * User-map repository shape (roadmap A photo-map, roadmap C GeoTIFF) -
           * interface and models only, no storage wired yet.
           *
           * A user map is a calibrated image: four control points (grid-line
           * intersections = cell corners, see `Coordinates.parseMgrsCorner`) locate the
           * image pixels as an [ImageQuad]; both engines render it the same way
           * (osmdroid: perspective `drawBitmap(matrix)`; MapLibre: an image source over
           * the quad). Source files live in `filesDir/usermaps/<id>.bin` as opaque bytes
           * - never re-encoded, so a GeoTIFF's georeferencing survives - and the
           * downsampled render copy (2048 px, RGB_565) is derived at draw time.
           *
           * [ImageQuad] is in this package today and moves to `:core` with the rest of
           * the portable models; the import here follows it then, not before.
           */
          data class UserMap(
              val id: String,
              val name: String,
              /** File name under filesDir/usermaps/. Opaque source bytes. */
              val fileName: String,
              val quad: ImageQuad,
          )

          interface UserMapStore {
              val maps: StateFlow<List<UserMap>>
              suspend fun add(map: UserMap)
              suspend fun setVisible(id: String, visible: Boolean)
              suspend fun setOpacity(id: String, opacity: Float)
              suspend fun delete(id: String)
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/platform'
          cat > 'app/src/main/java/app/gridfix/android/platform/GraphicGeoJson.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.platform

          import app.gridfix.android.data.GraphicTypes
          import app.gridfix.android.data.TacGraphic
          import java.util.Locale

          /**
           * Portable GeoJSON for tactical graphics - pure Kotlin, no Android imports.
           *
           * This is the interchange shape MapLibre consumes on both platforms (a GeoJSON
           * source plus line/fill/symbol layers) and the shape a future "import overlay"
           * feature would read. The geometry rule mirrors `InterchangeFiles.buildKml`
           * exactly, and GoldenVectors.graphicGeometry holds the same table for the Swift
           * port, so the two cannot answer differently for the same graphic.
           *
           * Moves to `:core` verbatim once [TacGraphic] does.
           */

          /**
           * Point / LineString / Polygon for this graphic's vertices, or null when there
           * is nothing to draw.
           *
           * Null matters. A graphic with no vertices has no valid GeoJSON geometry at
           * all; emitting a Point with an empty coordinate array produces a document that
           * fails to parse, and one bad feature takes the whole layer down with it.
           */
          fun graphicGeometryKind(type: String, vertexCount: Int): String? = when {
              vertexCount <= 0 -> null
              vertexCount == 1 -> "Point"
              GraphicTypes.isArea(type) && vertexCount >= 3 -> "Polygon"
              else -> "LineString"
          }

          private fun lonLat(lat: Double, lon: Double): String =
              String.format(Locale.US, "[%.7f,%.7f]", lon, lat)

          /**
           * One GeoJSON Feature for this graphic, or null when it has no geometry.
           * Properties carry the metadata the style layers filter on.
           */
          fun TacGraphic.toGeoJsonFeature(): String? {
              val kind = graphicGeometryKind(type, points.size) ?: return null
              val geometry = when (kind) {
                  "Point" -> {
                      val p = points.first()
                      "{\"type\":\"Point\",\"coordinates\":${lonLat(p.lat, p.lon)}}"
                  }
                  "Polygon" -> {
                      // A GeoJSON ring must close: repeat the first vertex last.
                      val ring = points + points.first()
                      val coords = ring.joinToString(",") { lonLat(it.lat, it.lon) }
                      "{\"type\":\"Polygon\",\"coordinates\":[[$coords]]}"
                  }
                  else -> {
                      val coords = points.joinToString(",") { lonLat(it.lat, it.lon) }
                      "{\"type\":\"LineString\",\"coordinates\":[$coords]}"
                  }
              }
              return "{\"type\":\"Feature\",\"geometry\":$geometry,\"properties\":{" +
                  "\"id\":${jsonStr(id)}," +
                  "\"name\":${jsonStr(name)}," +
                  "\"tacType\":${jsonStr(type)}," +
                  "\"folder\":${jsonStr(folder)}," +
                  "\"affiliation\":${jsonStr(affiliation)}," +
                  "\"echelon\":${jsonStr(echelon)}}}"
          }

          /** A whole overlay as one FeatureCollection. Graphics with no geometry drop out. */
          fun List<TacGraphic>.toGeoJson(): String =
              "{\"type\":\"FeatureCollection\",\"features\":[" +
                  mapNotNull { it.toGeoJsonFeature() }.joinToString(",") +
                  "]}"

          /**
           * JSON string escaping. Every control character has to go: a raw tab or newline
           * inside a JSON string is invalid, and a user is perfectly capable of pasting
           * one into a graphic name.
           */
          internal fun jsonStr(s: String): String = buildString(s.length + 2) {
              append('"')
              for (c in s) {
                  when (c) {
                      '\\' -> append("\\\\")
                      '"' -> append("\\\"")
                      '\n' -> append("\\n")
                      '\r' -> append("\\r")
                      '\t' -> append("\\t")
                      '\b' -> append("\\b")
                      '\u000C' -> append("\\f")
                      else -> if (c < ' ') append(String.format(Locale.US, "\\u%04x", c.code)) else append(c)
                  }
              }
              append('"')
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
          cat > 'app/src/main/java/app/gridfix/android/ui/GridFixApp.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.ui

          import android.Manifest
