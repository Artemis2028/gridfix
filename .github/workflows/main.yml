          package app.gridfix.android

          /**
           * GENERATED by kmp/gen_golden.py - do not edit by hand.
           *
           * The same numbers ship to iOS as `golden.json`, read there by GoldenTests.swift.
           * One generator, two forms: if the Swift port and this app ever disagree about
           * a grid or a distance, whichever side moved goes red. A wrong grid looks
           * exactly like a right one, so this is the only place that can catch it.
           *
           * Vectors are CSV inside string constants rather than thousands of constructor
           * calls, because a listOf() that large overflows the 64 KB limit on <clinit>.
           *
           * MGRS strings are snapped to their own cell centre, so every one has at least
           * half a cell of clearance from any edge and a few metres of disagreement
           * between two correct projections can never flip a digit.
           */
          object GoldenVectors {

              const val TOL_UTM_METERS = 0.5
              const val TOL_LATLON_DEGREES = 1e-05
              const val TOL_DISTANCE_METERS = 0.5
              const val TOL_BEARING_DEGREES = 0.01
              const val TOL_CONVERGENCE_DEGREES = 1e-06

              data class Utm(
                  val name: String, val lat: Double, val lon: Double,
                  val zone: Int, val hemisphere: Char,
                  val easting: Double, val northing: Double, val band: Char,
              )

              data class Forward(
                  val name: String, val lat: Double, val lon: Double,
                  val digits: Int, val mgrs: String,
              )

              data class ParseCase(
                  val mgrs: String,
                  val centreLat: Double, val centreLon: Double,
                  val cornerLat: Double, val cornerLon: Double,
              )

              data class Leg(
                  val name: String,
                  val fromLat: Double, val fromLon: Double,
                  val toLat: Double, val toLon: Double,
                  val meters: Double, val bearing: Double,
              )

              data class Convergence(
                  val lat: Double, val lon: Double, val zone: Int, val degrees: Double,
              )

              private fun rows(csv: String): List<List<String>> =
                  csv.trim().lines().filter { it.isNotBlank() }.map { it.split(",") }

              val utm: List<Utm> by lazy {
                  rows(UTM_CSV).map {
                      Utm(it[0], it[1].toDouble(), it[2].toDouble(), it[3].toInt(),
                          it[4][0], it[5].toDouble(), it[6].toDouble(), it[7][0])
                  }
              }

              val mgrsForward: List<Forward> by lazy {
                  rows(FORWARD_CSV).map {
                      Forward(it[0], it[1].toDouble(), it[2].toDouble(), it[3].toInt(), it[4])
                  }
              }

              val mgrsParse: List<ParseCase> by lazy {
                  rows(PARSE_CSV).map {
                      ParseCase(it[0], it[1].toDouble(), it[2].toDouble(),
                                it[3].toDouble(), it[4].toDouble())
                  }
              }

              val distance: List<Leg> by lazy {
                  rows(DISTANCE_CSV).map {
                      Leg(it[0], it[1].toDouble(), it[2].toDouble(), it[3].toDouble(),
                          it[4].toDouble(), it[5].toDouble(), it[6].toDouble())
                  }
              }

              val convergence: List<Convergence> by lazy {
                  rows(CONVERGENCE_CSV).map {
                      Convergence(it[0].toDouble(), it[1].toDouble(), it[2].toInt(), it[3].toDouble())
                  }
              }

              // name,lat,lon,zone,hemisphere,easting,northing,band
              private const val UTM_CSV = """
          uae-abu-dhabi,24.4539,54.3773,40,N,234124.881,2707001.291,R
          uae-liwa,23.13,53.78,39,N,784702.852,2560625.46,Q
          uae-jebel-hafeet,24.058,55.775,40,N,375453.46,2661190.794,R
          fort-benning,32.3524,-84.947,16,N,693189.275,3581350.292,S
          fort-bragg,35.139,-79.006,17,N,681660.045,3890277.629,S
          nttc-hohenfels,49.218,11.837,32,N,706585.903,5455564.479,U
