name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.22 (landscape map painting fix and the 0.9.20 review cut) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.22-d3d306265e0d" ]; then
            echo "payload v0.9.22-d3d306265e0d already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 50
                  versionName = "0.9.22"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              // 2.8.3+ only. With Compose 1.6 (this BOM), lifecycle 2.8's LocalLifecycleOwner
              // finds Compose UI's copy by REFLECTION, and 2.8.2 shipped no keep rule for
              // it: the debug build ran, the R8 build died on first composition with
              // "CompositionLocal LocalLifecycleOwner not present" (lifecycle b/346808608,
              // fixed 2.8.3). 2.8.5 is the last 2.8.x before the Compose Runtime 1.7.1
              // dependency; do not go past it without moving the BOM to Compose 1.7.
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
              // org.json ships in android.jar as a stub that returns defaults under
              // isReturnDefaultValues, so a JVM test cannot parse its own output
              // without the real artifact on the test classpath ahead of it.
              testImplementation("org.json:json:20240303")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_GRIDFIX'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <!-- Map tiles only: the app has no accounts, no analytics, no data collection -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <!-- Track recording continues with the screen off; the log never leaves the phone -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <!-- Arrival alert buzz when reaching a navigation target -->
              <uses-permission android:name="android.permission.VIBRATE" />

              <uses-feature
                  android:name="android.hardware.location.gps"
                  android:required="false" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GridFix"
                  android:allowBackup="false">

                  <!--
                    allowBackup="false" is deliberate and load-bearing. The permission screen
                    tells the user "everything stays on your phone - no account, no tracking",
                    and the default (true) would copy every waypoint, track, folder and setting
                    into their Google Drive backup. The app's own backup zip is the supported
                    way to move data between devices.
                  -->

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".location.TrackRecorderService"
                      android:exported="false"
                      android:foregroundServiceType="location" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="app.gridfix.android.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/DataPackage.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipEntry
          import java.util.zip.ZipInputStream
          import java.util.zip.ZipOutputStream

          /**
           * ATAK mission data packages (tier 1-2 interop): a zip carrying a
           * MissionPackageManifest plus content files. Import reads Cursor-on-Target
           * (.cot) point events into waypoints (affiliation from the CoT type) and
           * hands any bundled GPX/KML/KMZ to the normal importers. Export writes one
           * CoT event per waypoint, routes as a GPX entry, and the manifest — a
           * package ATAK ingests directly.
           */
          object DataPackage {

              private const val MAX_ENTRY_BYTES = 32L * 1024 * 1024

              /** Read one zip entry into memory, or null when it is larger than we are willing to hold. */
              private fun readCapped(zin: ZipInputStream): ByteArray? {
                  val out = java.io.ByteArrayOutputStream()
                  val buf = ByteArray(16 * 1024)
                  var total = 0L
                  while (true) {
                      val n = zin.read(buf)
                      if (n < 0) break
                      total += n
                      if (total > MAX_ENTRY_BYTES) return null
                      out.write(buf, 0, n)
                  }
                  return out.toByteArray()
              }

              // ---------------- Import ----------------

              fun parse(stream: InputStream): InterchangeFiles.ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  var lines = listOf<InterchangeFiles.ImportedLine>()
                  var areas = listOf<InterchangeFiles.ImportedLine>()
                  var tracks = listOf<InterchangeFiles.ImportedTrack>()

                  val zin = ZipInputStream(stream)
                  var entry: ZipEntry? = zin.nextEntry
                  while (entry != null) {
                      val name = entry.name
                      val lower = name.lowercase(Locale.US)
                      val wanted = lower.endsWith(".cot") || lower.endsWith(".gpx") ||
                          lower.endsWith(".kml") || lower.endsWith(".kmz")
                      val bytes = if (!entry.isDirectory && wanted) readCapped(zin) else null
                      if (bytes != null) {
                          when {
                              lower.endsWith(".cot") ->
                                  parseCot(ByteArrayInputStream(bytes))?.let { wps.add(it) }
                              lower.endsWith(".gpx") || lower.endsWith(".kml") || lower.endsWith(".kmz") -> {
                                  InterchangeFiles.parse(name, ByteArrayInputStream(bytes))?.let { d ->
                                      wps.addAll(d.waypoints)
                                      lines = lines + d.lines
                                      areas = areas + d.areas
                                      tracks = tracks + d.tracks
                                  }
                              }
                          }
                      }
                      zin.closeEntry()
                      entry = zin.nextEntry
                  }
                  return InterchangeFiles.ImportedData(
                      waypoints = wps,
                      lines = lines,
                      areas = areas,
                      tracks = tracks,
                  )
              }

              /** One CoT event file -> a waypoint draft (null when it has no position). */
              private fun parseCot(stream: InputStream): WaypointDraft? = runCatching {
                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)
                  var lat: Double? = null
                  var lon: Double? = null
                  var type = ""
                  var callsign = ""
                  var uid = ""
                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      if (event == XmlPullParser.START_TAG) {
                          when (parser.name) {
                              "event" -> {
                                  type = parser.getAttributeValue(null, "type") ?: ""
                                  uid = parser.getAttributeValue(null, "uid") ?: ""
                              }
                              "point" -> {
                                  // The same range check the GPX and KML paths already used. Without
                                  // it a NaN in one .cot aborted the entire import with "Forbidden
                                  // numeric value", and a lat of 500 was stored as written.
                                  lat = InterchangeFiles.coord(parser.getAttributeValue(null, "lat"), 90.0)
                                      .takeIf { it.isFinite() }
                                  lon = InterchangeFiles.coord(parser.getAttributeValue(null, "lon"), 180.0)
                                      .takeIf { it.isFinite() }
                              }
                              "contact" -> {
                                  callsign = parser.getAttributeValue(null, "callsign") ?: callsign
                              }
                          }
                      }
                      event = parser.next()
                  }
                  val la = lat ?: return null
                  val lo = lon ?: return null
                  if (la == 0.0 && lo == 0.0) return null
                  // Routes (b-m-r), drawings (u-d-*) and chat/position reports are not markers
                  if (type.startsWith("b-m-r") || type.startsWith("u-d-") || type.startsWith("b-t-")) return null
                  WaypointDraft(
                      name = callsign.ifBlank { uid.ifBlank { "ATAK point" } }.take(30),
                      lat = la,
                      lon = lo,
                      folder = InterchangeFiles.IMPORT_FOLDER,
                      symbol = "target",
                      affiliation = affiliationFromCotType(type),
                  )
              }.getOrNull()

              /** CoT type "a-f-G-U-C" -> affiliation from the second field. */
              private fun affiliationFromCotType(type: String): String {
                  val parts = type.split("-")
                  if (parts.size < 2 || parts[0] != "a") return "none"
                  return when (parts[1].lowercase(Locale.US)) {
                      "f", "a" -> "friendly"    // friend / assumed friend
                      "h", "j", "k" -> "hostile" // hostile / joker / faker
                      "n" -> "neutral"
                      "u", "p", "s" -> "unknown" // unknown / pending / suspect
                      else -> "none"
                  }
              }

              // ---------------- Export ----------------

              private fun cotType(affiliation: String): String = when (affiliation) {
                  "friendly" -> "a-f-G"
                  "hostile" -> "a-h-G"
                  "neutral" -> "a-n-G"
                  else -> "a-u-G"
              }

              private fun esc(s: String): String = s
                  .replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;")

              /**
               * Write a complete mission package. Waypoints become individual CoT
               * events; routes ride along as one GPX entry ATAK can also read.
               */
              fun build(
                  out: OutputStream,
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  nowMillis: Long,
              ) {
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  val time = sdf.format(Date(nowMillis))
                  val stale = sdf.format(Date(nowMillis + 365L * 24 * 3600 * 1000))
                  val pkgUid = "gridfix-$nowMillis"

                  val zip = ZipOutputStream(out)
                  val entries = ArrayList<String>()

                  waypoints.forEachIndexed { i, w ->
                      val entryName = "cot/gridfix-$i.cot"
                      entries.add(entryName)
                      // Stable per waypoint (no list index): a re-sent package updates the
                      // same marker in ATAK instead of creating a duplicate.
                      val uid = "GRIDFIX-" + w.id
                      val cot = buildString {
                          append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                          append("<event version=\"2.0\" uid=\"").append(esc(uid))
                          append("\" type=\"").append(if (w.kind == KIND_UNIT) cotType(w.affiliation) else "b-m-p-w")
                          append("\" time=\"").append(time)
                          append("\" start=\"").append(time)
                          append("\" stale=\"").append(stale)
                          append("\" how=\"h-g-i-g-o\">\n")
                          append(
                              String.format(
                                  Locale.US,
                                  "  <point lat=\"%.7f\" lon=\"%.7f\" hae=\"9999999.0\" ce=\"9999999.0\" le=\"9999999.0\"/>\n",
                                  w.lat, w.lon,
                              )
                          )
                          append("  <detail>\n")
                          append("    <contact callsign=\"").append(esc(w.name)).append("\"/>\n")
                          if (w.folder.isNotBlank()) {
                              append("    <remarks>").append(esc(w.folder)).append("</remarks>\n")
                          }
                          append("  </detail>\n")
                          append("</event>\n")
                      }
                      zip.putNextEntry(ZipEntry(entryName))
                      zip.write(cot.toByteArray())
                      zip.closeEntry()
                  }

                  if (routes.isNotEmpty()) {
                      entries.add("routes.gpx")
                      val gpx = InterchangeFiles.buildGpx(emptyList(), routes, emptyList())
                      zip.putNextEntry(ZipEntry("routes.gpx"))
                      zip.write(gpx.toByteArray())
                      zip.closeEntry()
                  }

                  val manifest = buildString {
                      append("<MissionPackageManifest version=\"2\">\n")
                      append("  <Configuration>\n")
                      append("    <Parameter name=\"uid\" value=\"").append(esc(pkgUid)).append("\"/>\n")
                      append("    <Parameter name=\"name\" value=\"MGRS GPS export\"/>\n")
                      append("  </Configuration>\n")
                      append("  <Contents>\n")
                      for (e in entries) {
                          append("    <Content ignore=\"false\" zipEntry=\"").append(esc(e)).append("\"/>\n")
                      }
                      append("  </Contents>\n")
                      append("</MissionPackageManifest>\n")
                  }
                  zip.putNextEntry(ZipEntry("MANIFEST/manifest.xml"))
                  zip.write(manifest.toByteArray())
                  zip.closeEntry()
                  zip.finish()
              }

              fun buildBytes(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  nowMillis: Long,
              ): ByteArray {
                  val bos = ByteArrayOutputStream()
                  build(bos, waypoints, routes, nowMillis)
                  return bos.toByteArray()
              }
          }
          EOF_GRIDFIX
          cat > 'app/src/main/java/app/gridfix/android/data/InterchangeFiles.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.util.Xml
          import org.xmlpull.v1.XmlPullParser
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.ZipInputStream

          /**
           * GPX 1.1 and KML/KMZ interchange: the file formats land-nav and TAK users
           * actually trade. Import is tolerant (skips what it can't read); export writes
           * plain, widely-accepted documents. Everything is streamed with XmlPullParser —
           * no external dependencies.
           */
          object InterchangeFiles {

              /**
               * A coordinate attribute as a finite, in-range double, else NaN (rejects "NaN",
               * "Infinity", 120). Internal rather than private so the CoT path in [DataPackage]
               * uses the same check instead of its own looser one.
               */
              internal fun coord(raw: String?, limit: Double): Double {
                  val v = raw?.trim()?.toDoubleOrNull() ?: return Double.NaN
                  return if (v.isFinite() && v >= -limit && v <= limit) v else Double.NaN
              }

              data class ImportedLine(val name: String, val folder: String, val points: List<GeoVertex>)
              data class ImportedTrack(val name: String, val points: List<TrackPoint>)

              data class ImportedData(
                  val waypoints: List<WaypointDraft> = emptyList(),
                  val lines: List<ImportedLine> = emptyList(),      // become route graphics
                  val areas: List<ImportedLine> = emptyList(),      // become assembly-area graphics
                  val tracks: List<ImportedTrack> = emptyList(),
              ) {
                  val isEmpty: Boolean
                      get() = waypoints.isEmpty() && lines.isEmpty() && areas.isEmpty() && tracks.isEmpty()

                  fun summary(): String {
                      val parts = mutableListOf<String>()
                      if (waypoints.isNotEmpty()) parts.add("${waypoints.size} waypoints")
                      if (lines.isNotEmpty()) parts.add("${lines.size} lines")
                      if (areas.isNotEmpty()) parts.add("${areas.size} areas")
                      if (tracks.isNotEmpty()) parts.add("${tracks.size} tracks")
                      return if (parts.isEmpty()) "nothing importable found" else "Imported " + parts.joinToString(", ")
                  }
              }

              const val IMPORT_FOLDER = "Imported"

              /** Route by file name; returns null when the format isn't recognized. */
              fun parse(fileName: String, stream: InputStream): ImportedData? {
                  val lower = fileName.lowercase(Locale.US)
                  return when {
                      lower.endsWith(".gpx") -> parseGpx(stream)
                      lower.endsWith(".kml") -> parseKml(stream)
                      lower.endsWith(".kmz") -> parseKmz(stream)
                      // ATAK mission data packages (and generic zips of the above)
                      lower.endsWith(".zip") || lower.endsWith(".dpk") -> DataPackage.parse(stream)
                      else -> null
                  }
              }

              // ---------------- GPX ----------------

              fun parseGpx(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val tracks = ArrayList<ImportedTrack>()
                  val lines = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  var wptLat = 0.0
                  var wptLon = 0.0
                  var inWpt = false
                  var name = ""
                  var trkName = ""
                  var trkPts = ArrayList<TrackPoint>()
                  var inTrk = false
                  var rteName = ""
                  var rtePts = ArrayList<GeoVertex>()
                  var inRte = false
                  var pendingTime = 0L
                  var pendingEle = NO_ALTITUDE
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "wpt" -> {
                                      inWpt = true
                                      name = ""
                                      wptLat = coord(parser.getAttributeValue(null, "lat"), 90.0)
                                      wptLon = coord(parser.getAttributeValue(null, "lon"), 180.0)
                                  }
                                  "trk" -> {
                                      inTrk = true
                                      trkName = ""
                                      trkPts = ArrayList()
                                  }
                                  "rte" -> {
                                      inRte = true
                                      rteName = ""
                                      rtePts = ArrayList()
                                  }
                                  "trkpt" -> {
                                      val lat = coord(parser.getAttributeValue(null, "lat"), 90.0)
                                      val lon = coord(parser.getAttributeValue(null, "lon"), 180.0)
                                      pendingTime = 0L
                                      pendingEle = NO_ALTITUDE
                                      if (!lat.isNaN() && !lon.isNaN() && inTrk) {
                                          trkPts.add(TrackPoint(lat, lon, 0L, 0.0))
                                      }
                                  }
                                  "rtept" -> {
                                      val lat = coord(parser.getAttributeValue(null, "lat"), 90.0)
                                      val lon = coord(parser.getAttributeValue(null, "lon"), 180.0)
                                      if (!lat.isNaN() && !lon.isNaN() && inRte) {
                                          rtePts.add(GeoVertex(lat, lon))
                                      }
                                  }
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inWpt && name.isEmpty()) name = t
                                      else if (inTrk && trkName.isEmpty()) trkName = t
                                      else if (inRte && rteName.isEmpty()) rteName = t
                                  }
                                  "ele" -> pendingEle = textBuf.trim().toDoubleOrNull()?.takeIf { it.isFinite() } ?: NO_ALTITUDE
                                  "time" -> pendingTime = parseIsoTime(textBuf.trim())
                                  "trkpt" -> {
                                      if (inTrk && trkPts.isNotEmpty()) {
                                          val last = trkPts.removeAt(trkPts.size - 1)
                                          trkPts.add(last.copy(time = pendingTime, alt = pendingEle))
                                      }
                                  }
                                  "wpt" -> {
                                      if (inWpt && !wptLat.isNaN() && !wptLon.isNaN()) {
                                          wps.add(
                                              WaypointDraft(
                                                  name = name.ifBlank { "WP ${wps.size + 1}" },
                                                  lat = wptLat,
                                                  lon = wptLon,
                                                  folder = IMPORT_FOLDER,
                                                  symbol = "flag",
                                                  affiliation = "none",
                                              )
                                          )
                                      }
                                      inWpt = false
                                  }
                                  "trk" -> {
                                      if (inTrk && trkPts.size >= 2) {
                                          tracks.add(
                                              ImportedTrack(trkName.ifBlank { "Imported track" }, trkPts)
                                          )
                                      }
                                      inTrk = false
                                  }
                                  "rte" -> {
                                      if (inRte && rtePts.size >= 2) {
                                          lines.add(
                                              ImportedLine(rteName.ifBlank { "Imported route" }, IMPORT_FOLDER, rtePts)
                                          )
                                      }
                                      inRte = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, tracks = tracks)
              }

              fun buildGpx(
                  waypoints: List<Waypoint>,
                  routes: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                  for (w in waypoints) {
                      sb.append(
                          String.format(
                              Locale.US, "  <wpt lat=\"%.7f\" lon=\"%.7f\"><name>%s</name></wpt>\n",
                              w.lat, w.lon, escapeXml(w.name),
                          )
                      )
                  }
                  for (r in routes) {
                      sb.append("  <rte><name>").append(escapeXml(r.name)).append("</name>\n")
                      for (p in r.points) {
                          sb.append(
                              String.format(Locale.US, "    <rtept lat=\"%.7f\" lon=\"%.7f\"/>\n", p.lat, p.lon)
                          )
                      }
                      sb.append("  </rte>\n")
                  }
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  for ((info, pts) in tracks) {
                      sb.append("  <trk><name>").append(escapeXml(info.name)).append("</name><trkseg>\n")
                      for (p in pts) {
                          val ele = if (p.alt.hasAltitude()) String.format(Locale.US, "<ele>%.1f</ele>", p.alt) else ""
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "    <trkpt lat=\"%.7f\" lon=\"%.7f\">%s<time>%s</time></trkpt>\n",
                                  p.lat, p.lon, ele, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("  </trkseg></trk>\n")
                  }
                  sb.append("</gpx>\n")
                  return sb.toString()
              }

              // ---------------- KML / KMZ ----------------

              fun parseKmz(stream: InputStream): ImportedData {
                  ZipInputStream(stream).use { zip ->
                      var entry = zip.nextEntry
                      while (entry != null) {
                          if (!entry.isDirectory && entry.name.lowercase(Locale.US).endsWith(".kml")) {
                              return parseKml(zip)
                          }
                          entry = zip.nextEntry
                      }
                  }
                  return ImportedData()
              }

              fun parseKml(stream: InputStream): ImportedData {
                  val wps = ArrayList<WaypointDraft>()
                  val lines = ArrayList<ImportedLine>()
                  val areas = ArrayList<ImportedLine>()

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  val folderStack = ArrayDeque<String>()
                  var awaitingFolderName = false
                  var inPlacemark = false
                  var pmName = ""
                  var geomType = ""        // point / line / polygon
                  var coordText = ""
                  var inCoordinates = false
                  var textBuf = ""

                  var event = parser.eventType
                  while (event != XmlPullParser.END_DOCUMENT) {
                      when (event) {
                          XmlPullParser.START_TAG -> {
                              textBuf = ""
                              when (parser.name) {
                                  "Folder" -> {
                                      folderStack.addLast("")
                                      awaitingFolderName = true
                                  }
                                  "Placemark" -> {
                                      inPlacemark = true
                                      pmName = ""
                                      geomType = ""
                                      coordText = ""
                                  }
                                  "Point" -> if (inPlacemark) geomType = "point"
                                  "LineString" -> if (inPlacemark) geomType = "line"
                                  "Polygon" -> if (inPlacemark) geomType = "polygon"
                                  "coordinates" -> inCoordinates = true
                              }
                          }
                          XmlPullParser.TEXT -> textBuf += parser.text ?: ""
                          XmlPullParser.END_TAG -> {
                              when (parser.name) {
                                  "name" -> {
                                      val t = textBuf.trim()
                                      if (inPlacemark) {
                                          if (pmName.isEmpty()) pmName = t
                                      } else if (awaitingFolderName && folderStack.isNotEmpty()) {
                                          folderStack.removeLast()
                                          folderStack.addLast(t)
                                          awaitingFolderName = false
                                      }
                                  }
                                  "coordinates" -> {
                                      inCoordinates = false
                                      if (inPlacemark && coordText.isEmpty()) coordText = textBuf
                                  }
                                  "Folder" -> {
                                      if (folderStack.isNotEmpty()) folderStack.removeLast()
                                      awaitingFolderName = false
                                  }
                                  "Placemark" -> {
                                      if (inPlacemark) {
                                          val folder = folderStack.lastOrNull { it.isNotBlank() } ?: IMPORT_FOLDER
                                          val pts = parseKmlCoordinates(coordText)
                                          when {
                                              geomType == "point" && pts.isNotEmpty() -> wps.add(
                                                  WaypointDraft(
                                                      name = pmName.ifBlank { "WP ${wps.size + 1}" },
                                                      lat = pts[0].lat,
                                                      lon = pts[0].lon,
                                                      folder = folder,
                                                      symbol = "flag",
                                                      affiliation = "none",
                                                  )
                                              )
                                              geomType == "line" && pts.size >= 2 -> lines.add(
                                                  ImportedLine(pmName.ifBlank { "Imported line" }, folder, pts)
                                              )
                                              geomType == "polygon" && pts.size >= 3 -> areas.add(
                                                  ImportedLine(pmName.ifBlank { "Imported area" }, folder, pts)
                                              )
                                          }
                                      }
                                      inPlacemark = false
                                  }
                              }
                          }
                      }
                      event = parser.next()
                  }
                  return ImportedData(waypoints = wps, lines = lines, areas = areas)
              }

              /** KML coordinate lists are "lon,lat[,alt]" tuples separated by whitespace. */
              private fun parseKmlCoordinates(text: String): List<GeoVertex> =
                  text.trim().split(Regex("\\s+")).mapNotNull { tuple ->
                      val parts = tuple.split(",")
                      if (parts.size < 2) return@mapNotNull null
                      val lon = parts[0].toDoubleOrNull() ?: return@mapNotNull null
                      val lat = parts[1].toDoubleOrNull() ?: return@mapNotNull null
                      if (lat in -90.0..90.0 && lon in -180.0..180.0) GeoVertex(lat, lon) else null
                  }.let { pts ->
                      // drop the duplicated closing vertex polygons carry
                      if (pts.size >= 2 && pts.first() == pts.last()) pts.dropLast(1) else pts
                  }

              fun buildKml(
                  waypoints: List<Waypoint>,
                  graphics: List<TacGraphic>,
                  tracks: List<Pair<TrackInfo, List<TrackPoint>>>,
              ): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<kml xmlns=\"http://www.opengis.net/kml/2.2\"><Document>\n")
                  sb.append("<name>MGRS GPS export</name>\n")

                  for ((folder, list) in waypoints.groupBy { it.folder }) {
                      sb.append("<Folder><name>").append(escapeXml(folder)).append("</name>\n")
                      for (w in list) {
                          sb.append("<Placemark><name>").append(escapeXml(w.name)).append("</name>")
                          sb.append(
                              String.format(
                                  Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                  w.lon, w.lat,
                              )
                          )
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (graphics.isNotEmpty()) {
                      sb.append("<Folder><name>Graphics</name>\n")
                      for (g in graphics) {
                          val closed = GraphicTypes.isArea(g.type) && g.points.size >= 3
                          sb.append("<Placemark><name>")
                              .append(escapeXml(GraphicTypes.labelPrefix(g.type) + g.name))
                              .append("</name>")
                          val coords = StringBuilder()
                          for (p in g.points) {
                              coords.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          if (closed && g.points.isNotEmpty()) {
                              coords.append(
                                  String.format(Locale.US, "%.7f,%.7f,0", g.points[0].lon, g.points[0].lat)
                              )
                          }
                          if (g.points.size == 1) {
                              // Point graphics (TRP, checkpoint, text) export as placemarks
                              sb.append(
                                  String.format(
                                      Locale.US, "<Point><coordinates>%.7f,%.7f,0</coordinates></Point>",
                                      g.points[0].lon, g.points[0].lat,
                                  )
                              )
                          } else if (closed) {
                              sb.append("<Polygon><outerBoundaryIs><LinearRing><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LinearRing></outerBoundaryIs></Polygon>")
                          } else {
                              sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                                  .append(coords.toString().trim())
                                  .append("</coordinates></LineString>")
                          }
                          sb.append("</Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  if (tracks.isNotEmpty()) {
                      sb.append("<Folder><name>Tracks</name>\n")
                      for ((info, pts) in tracks) {
                          sb.append("<Placemark><name>").append(escapeXml(info.name)).append("</name>")
                          sb.append("<LineString><tessellate>1</tessellate><coordinates>")
                          for (p in pts) {
                              sb.append(String.format(Locale.US, "%.7f,%.7f,0 ", p.lon, p.lat))
                          }
                          sb.append("</coordinates></LineString></Placemark>\n")
                      }
                      sb.append("</Folder>\n")
                  }

                  sb.append("</Document></kml>\n")
                  return sb.toString()
              }

              // ---------------- helpers ----------------

              private fun parseIsoTime(text: String): Long = runCatching {
                  val cleaned = text.replace(Regex("\\.\\d+"), "").removeSuffix("Z")
                  val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  sdf.parse(cleaned)?.time ?: 0L
              }.getOrDefault(0L)

              private fun escapeXml(s: String): String = s
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace("\"", "&quot;")
          }
          EOF_GRIDFIX
