# GridFix 1.0.1 - single-file paste installer and retained build workflow.
# Replace ALL of .github/workflows/main.yml with this file, including the payload
# comments at the bottom, and commit the edit on main. No other file upload needed.
# 1.0.1: review fixes before production - selected Navigate target is authoritative (never swapped for a visible point; hidden selections are offered, deleted ones show no target), pocket guide follows target moves and declination changes app-wide, route waypoint replacement scoped to the folder, the active recording cannot be deleted from any route, distinct notification ID, per-download pinned tile writer replaces the global expiry override and re-pins browsed tiles, download zoom range clamped to the source maximum.
# Generated against main at 48be0afcb7e176a4764b8c973b29ca2b32297e57 (tree fingerprint 855f94b7529ed95c...).
# Post-apply tree fingerprint 6406098a3f194ad9... ; 11 paths change.
# Payload SHA-256: 2c40dd6efa8b557741dcb408056f3a29f65006e049152026178c706466447445
# The payload is a gzip/base64 JSON bundle of unified diffs keyed by the starting
# tree's fingerprint. It is data, not YAML code, and must be pasted unedited.
#
# Same mechanism as the 0.9.30/0.9.31 installers: verify exact source -> stage
# the delta -> tests/debug/R8 release/mapping -> commit validated source
# (fast-forward only) -> publish artifacts and ci-status. Failure before publish
# commits nothing. A different starting tree fails explicitly; paste this as the
# only change in its commit, with nothing else added to main first.
# Docs: https://docs.github.com/en/actions/reference/actions-limits (500 KB per workflow file)
name: Build GridFix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridfix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_tree: ${{ steps.snapshot.outputs.tree }}
      version: ${{ steps.metadata.outputs.version }}
      tests: ${{ steps.tests.outcome }}
      debug: ${{ steps.debug.outcome }}
      release: ${{ steps.release.outcome }}
      signed: ${{ steps.signing.outputs.enabled }}
      mapping: ${{ steps.package.outputs.mapping }}
    steps:
      - name: Check out committed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Apply embedded 1.0.1 source with exact-input guards
        id: bootstrap
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          def fail(message):
              raise SystemExit('::error::' + message)
          workflow = pathlib.Path('.github/workflows/main.yml').read_text()
          start = '# BEGIN GRIDFIX SOURCE PAYLOAD\n'
          end = '# END GRIDFIX SOURCE PAYLOAD\n'
          if workflow.count(start) != 1 or workflow.count(end) != 1:
              fail('Embedded source payload is missing or duplicated. Paste the complete file.')
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          if not lines or any(not line.startswith('#| ') for line in lines):
              fail('Malformed payload. Paste the complete file without editing its encoded block.')
          try:
              bundle = gzip.decompress(base64.b64decode(''.join(line[3:] for line in lines), validate=True))
          except Exception:
              fail('Damaged source payload. Paste the complete original file again.')
          if hashlib.sha256(bundle).hexdigest() != '2c40dd6efa8b557741dcb408056f3a29f65006e049152026178c706466447445':
              fail('Source payload checksum mismatch. Nothing has been applied.')
          payload = json.loads(bundle)
          if payload.get('format') != 1:
              fail('Unknown embedded payload format.')
          if git('status', '--porcelain', '--untracked-files=no').strip():
              fail('Checkout is not clean. Refusing to overwrite local changes.')
          marker = pathlib.Path('.github/last-payload')
          expected_marker = 'v1.0.1-paste-2c40dd6efa8b5577'
          if marker.is_file() and marker.read_text().strip() == expected_marker:
              print('1.0.1 payload already committed; building current source without rewriting it.')
              raise SystemExit(0)
          excluded = {b'.github/workflows/main.yml', b'.github/last-payload'}
          def fingerprint():
              tree = git('write-tree').decode().strip()
              rows = git('ls-tree', '-rz', tree).split(b'\0')
              data = b'\0'.join(row for row in rows if row and row.split(b'\t', 1)[1] not in excluded)
              return hashlib.sha256(data).hexdigest()
          current = fingerprint()
          if current in payload['patches']:
              patch = payload['patches'][current].encode()
              git('apply', '--index', '--check', '--whitespace=error-all', '-', data=patch)
              git('apply', '--index', '--whitespace=error-all', '-', data=patch)
              print('Applied the matching source delta to the 1.0.1 candidate.')
          elif current == '6406098a3f194ad9cf125d2b2f626f935a059d7e1d393ee745d5877235d01322':
              print('Candidate source is already present; recording the paste-workflow marker only.')
          else:
              fail('Source differs from the tree this 1.0.1 installer was generated against (48be0afcb7e1) and its candidate. No source files were changed. Request a refreshed payload; do not remove this guard.')
          if fingerprint() != '6406098a3f194ad9cf125d2b2f626f935a059d7e1d393ee745d5877235d01322':
              fail('Post-apply source identity does not match the 1.0.1 candidate. Refusing to build.')
          marker.write_text(expected_marker + '\n')
          git('add', '--', '.github/last-payload')
          # This is local staging only. The write-enabled job is gated on all builds/tests.
          print('Source identity verified. Remote source will change only after validation succeeds.')
          PY

      - name: Check required build inputs and release version
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path('.')
          required = ['gradlew', 'gradle/wrapper/gradle-wrapper.jar',
                      'gradle/wrapper/gradle-wrapper.properties']
          fonts = ['antonio', 'saira_semi_condensed_regular', 'saira_semi_condensed_medium',
                   'saira_semi_condensed_semibold', 'saira_semi_condensed_bold',
                   'fira_mono_regular', 'fira_mono_medium', 'fira_mono_bold']
          required += [f'app/src/main/res/font/{font}.ttf' for font in fonts]
          for name in required:
              path = root / name
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit(f'Missing committed build input: {name}')
          symbols = list(root.glob('app/src/main/res/drawable-nodpi/nato_*.png'))
          if len(symbols) < 496 or any(not p.stat().st_size for p in symbols):
              raise SystemExit('Expected at least 496 nonempty committed NATO symbols')
          source = (root / 'app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', source)
          if not match:
              raise SystemExit('Missing semantic versionName')
          if tuple(map(int, match.group(1).split('.'))) < (1, 0, 1):
              raise SystemExit('Refusing to build pre-1.0.1 source with this workflow')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match.group(1)}\n')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run JVM regression tests
        id: tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace -Pkotlin.incremental=false 2>&1 | tee test.log

      - name: Build debug APK
        id: debug
        env:
          ESRI_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ESRI_KEY || '' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Pkotlin.incremental=false 2>&1 | tee build.log

      - name: Configure release signing on main
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_B64 || '' }}
          GRIDFIX_KS_PASS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASS || '' }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_B64" && -z "$GRIDFIX_KS_PASS" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No signing secrets: validating an unsigned minified release.'
          elif [[ -z "$ANDROID_KEYSTORE_B64" || -z "$GRIDFIX_KS_PASS" ]]; then
            echo '::error::Release signing requires both keystore and password secrets.'
            exit 1
          else
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gridfix-upload.p12"
            test -s "$RUNNER_TEMP/gridfix-upload.p12"
            echo "GRIDFIX_KS=$RUNNER_TEMP/gridfix-upload.p12" >> "$GITHUB_ENV"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build minified release bundle and APK
        id: release
        env:
          GRIDFIX_KS_PASS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          ESRI_KEY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ESRI_KEY || '' }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace -Pkotlin.incremental=false 2>&1 | tee release.log

      - name: Require deobfuscation mapping and package validated artifacts
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          outputs = pathlib.Path('app/build/outputs')
          bundle = outputs / 'bundle/release/app-release.aab'
          mapping = outputs / 'mapping/release/mapping.txt'
          if not mapping.is_file() or not mapping.stat().st_size:
              raise SystemExit('R8 mapping.txt is missing or empty')
          entry = 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'
          with zipfile.ZipFile(bundle) as archive:
              embedded = archive.read(entry)
          if not embedded or embedded != mapping.read_bytes():
              raise SystemExit('AAB mapping is absent or differs from this build mapping.txt')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'mapping={len(embedded)}\n')
          apk_name = 'app-release.apk' if os.environ['SIGNED'] == 'true' else 'app-release-unsigned.apk'
          release_apk = outputs / 'apk/release' / apk_name
          if not release_apk.is_file() or not release_apk.stat().st_size:
              raise SystemExit('Minified release APK is missing or empty')
          dist = pathlib.Path('dist')
          dist.mkdir()
          shutil.copyfile(outputs / 'apk/debug/app-debug.apk', dist / 'gridfix-debug.apk')
          if os.environ['SIGNED'] == 'true':
              shutil.copyfile(bundle, dist / 'gridfix-release.aab')
              shutil.copyfile(release_apk, dist / 'gridfix-release.apk')
              shutil.copyfile(mapping, dist / 'gridfix-mapping.txt')
          PY

      - name: Snapshot the exact validated source
        id: snapshot
        run: |
          # No build step may alter tracked inputs after the bootstrap staged them.
          git diff --exit-code
          snapshot_dir="$RUNNER_TEMP/gridfix-validated-source"
          mkdir -p "$snapshot_dir"
          git diff --cached --binary --full-index > "$snapshot_dir/source.patch"
          git write-tree > "$snapshot_dir/tree.txt"
          echo "tree=$(cat "$snapshot_dir/tree.txt")" >> "$GITHUB_OUTPUT"

      - name: Upload the validated source delta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridfix-validated-source
          path: ${{ runner.temp }}/gridfix-validated-source/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridfix-build
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release validation artifacts
        if: success() && steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridfix-unsigned-release-validation
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/gridfix-upload.p12"

      - name: Upload build logs and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridfix-build-logs
          path: |
            test.log
            build.log
            release.log
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  publish:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the validated source delta
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gridfix-validated-source
          path: ${{ runner.temp }}/gridfix-validated-source

      - name: Commit validated source without overwriting newer main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TREE: ${{ needs.build.outputs.source_tree }}
        run: |
          snapshot_dir="$RUNNER_TEMP/gridfix-validated-source"
          test -f "$snapshot_dir/source.patch"
          test "$(cat "$snapshot_dir/tree.txt")" = "$EXPECTED_TREE"
          if [[ -s "$snapshot_dir/source.patch" ]]; then
            git apply --index --check "$snapshot_dir/source.patch"
            git apply --index "$snapshot_dir/source.patch"
          fi
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          # The source delta must never update workflows using the Actions token.
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo '::error::Unexpected workflow in the source delta.'
            exit 1
          fi
          gh auth setup-git
          git fetch --no-tags origin refs/heads/main
          remote_sha=$(git rev-parse FETCH_HEAD)
          if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then
            if ! git diff --cached --quiet; then
              git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' \
                commit -qm 'Apply validated 1.0.1 source from paste workflow'
              # A concurrent push is a hard failure. No force-push, reset or rebase on main.
              git push origin HEAD:refs/heads/main
            fi
            source_sha=$(git rev-parse HEAD)
          elif [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$EXPECTED_TREE" ]]; then
            # A rerun after successful source sync must reuse the identical source commit.
            source_sha="$remote_sha"
            echo 'Identical validated source is already on main; no duplicate commit needed.'
          else
            echo '::error::main changed during this run. No source was pushed. Run the workflow against current main; never force-push this snapshot.'
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Validated source commit: `%s`\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Download validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gridfix-build
          path: dist

      - name: Archive the build and update latest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Do not move latest backwards if a newer source commit arrived.
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo '::error::main advanced after validation. Refusing to publish an obsolete candidate.'
            exit 1
          fi
          assets=(dist/*)
          test -s dist/gridfix-debug.apk
          archive="v${VERSION}-b${BUILD_NUMBER}"
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Validated JVM tests, debug build, and minified release bundle/APK.
          Install gridfix-debug.apk on a phone. When present, gridfix-release.apk is the signed, minified build for smoke testing; gridfix-release.aab is for Play Console upload. Keep gridfix-mapping.txt with the matching release for crash diagnostics.
          NOTES
          printf '\nSource commit: %s\nWorkflow trigger: %s\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.txt"
          if gh release view "$archive" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$archive" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$archive" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --prerelease --title "MGRS GPS v${VERSION} (build ${BUILD_NUMBER})" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
          if gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh auth setup-git
            git tag -f latest "$SOURCE_SHA"
            git push --force origin refs/tags/latest
            # Remove stale signed assets if this build has no signing configuration.
            for asset in gridfix-release.aab gridfix-release.apk gridfix-mapping.txt; do
              if [[ ! -f "dist/$asset" ]]; then
                asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" \
                  --jq ".assets[] | select(.name == \"$asset\") | .id")
                if [[ -n "$asset_id" ]]; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
                fi
              fi
            done
            gh release upload latest "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --repo "$GITHUB_REPOSITORY" --latest \
              --title "MGRS GPS v${VERSION} (build ${BUILD_NUMBER})" --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create latest "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --latest --title "MGRS GPS v${VERSION} (build ${BUILD_NUMBER})" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

  status:
    needs: [build, publish]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download diagnostic logs when available
        continue-on-error: true # Diagnostics may not exist when setup itself failed.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gridfix-build-logs
          path: logs

      - name: Download successful published build
        if: needs.build.result == 'success' && needs.publish.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gridfix-build
          path: dist

      - name: Update ci-status with the complete result
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEBUG_RESULT: ${{ needs.build.outputs.debug }}
          TEST_RESULT: ${{ needs.build.outputs.tests }}
          RELEASE_RESULT: ${{ needs.build.outputs.release }}
          AAB_MAPPING: ${{ needs.build.outputs.mapping }}
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
        run: |
          status_dir="$RUNNER_TEMP/gridfix-ci-status"
          mkdir -p "$status_dir"
          combined=failure
          if [[ "$BUILD_RESULT" == success && "$PUBLISH_RESULT" == success ]]; then
            combined=success
            cp dist/gridfix-debug.apk "$status_dir/gridfix-debug.apk"
          fi
          {
            echo "outcome=$combined"
            echo "build=$DEBUG_RESULT"
            echo "tests=$TEST_RESULT"
            echo "release=$RELEASE_RESULT"
            echo "publish=$PUBLISH_RESULT"
            echo "run=$GITHUB_RUN_NUMBER"
            echo "sha=${SOURCE_SHA:-$GITHUB_SHA}"
            echo "trigger_sha=$GITHUB_SHA"
            echo "aab_mapping=${AAB_MAPPING:-n/a}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$status_dir/outcome.txt"
          for kind in build test release; do
            if [[ -f "logs/$kind.log" ]]; then
              tail -n 400 "logs/$kind.log" > "$status_dir/${kind}log.txt"
            else
              echo 'Step did not produce a log.' > "$status_dir/${kind}log.txt"
            fi
          done
          gh auth setup-git
          cd "$status_dir"
          git init -q -b ci-status
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' \
            commit -qm "build $GITHUB_RUN_NUMBER: $combined"
          git push --force "https://github.com/$GITHUB_REPOSITORY.git" ci-status

