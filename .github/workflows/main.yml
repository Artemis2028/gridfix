                  // 48 dp of screen per line: at density 2 that is 96 px.
                  assertEquals(10L, chooseGridInterval(metersPerPixel = 0.05, density = 2f).toLong())
                  assertEquals(100L, chooseGridInterval(metersPerPixel = 1.0, density = 2f).toLong())
                  assertEquals(1000L, chooseGridInterval(metersPerPixel = 10.0, density = 2f).toLong())
                  assertEquals(10000L, chooseGridInterval(metersPerPixel = 100.0, density = 2f).toLong())
                  assertEquals(100000L, chooseGridInterval(metersPerPixel = 1000.0, density = 2f).toLong())
              }

              @Test
              fun `zoomed all the way out the metre grid gives way to GZD`() {
                  assertEquals(0L, chooseGridInterval(metersPerPixel = 5000.0, density = 2f).toLong())
              }

              @Test
              fun `a denser screen asks for a coarser interval at the same zoom`() {
                  val coarse = chooseGridInterval(metersPerPixel = 2.0, density = 1f)
                  val dense = chooseGridInterval(metersPerPixel = 2.0, density = 4f)
                  assertTrue("density should never make the grid finer", dense >= coarse)
              }

              // ---- Grid line values: the seam the missing 100 km line lived in ---------

              @Test
              fun `every multiple in range is present and nothing else, from an unaligned start`() {
                  // The exact viewport from the 0.9.20 review: a 10 km grid, ~85 km wide, with
                  // bounds floored to the fine interval. The old walk rounded 330000 down to
                  // 300000 (off screen) and stopped at 430000 > eMax, so 400000 - the one line
                  // actually on screen - was never drawn.
                  val values = gridLineValues(min = 330000.0, max = 415000.0, interval = 100000)
                  assertArrayEquals(longArrayOf(400000L), values)
              }

              @Test
              fun `an aligned minimum is included, not skipped`() {
                  assertArrayEquals(
                      longArrayOf(300000L, 400000L),
                      gridLineValues(min = 300000.0, max = 415000.0, interval = 100000),
                  )
              }

              @Test
              fun `the fine pass walks every step across the span`() {
                  assertArrayEquals(
                      longArrayOf(330000L, 340000L, 350000L, 360000L, 370000L, 380000L, 390000L, 400000L, 410000L),
                      gridLineValues(min = 330000.0, max = 415000.0, interval = 10000),
                  )
              }

              @Test
              fun `no multiple in the span means no lines rather than a wrong one`() {
                  assertEquals(0L, gridLineValues(min = 330001.0, max = 399999.0, interval = 100000).size.toLong())
              }

              @Test
              fun `values are multiples, ascending, and inside the range - swept`() {
                  // A drift guard over every interval the chooser can return, at a range of
                  // unaligned starts: the property, not the arithmetic, is what must hold.
                  for (interval in intArrayOf(10, 100, 1000, 10000, 100000)) {
                      for (offset in 0 until 10) {
                          val min = 1_234_567.0 + offset * 137.0
                          val max = min + interval * 6.5
                          val values = gridLineValues(min, max, interval)
                          var previous = Long.MIN_VALUE
                          for (v in values) {
                              assertEquals("interval $interval offset $offset: not a multiple", 0L, v % interval)
                              assertTrue("interval $interval offset $offset: below range", v >= min)
                              assertTrue("interval $interval offset $offset: above range", v <= max)
                              assertTrue("interval $interval offset $offset: not ascending", v > previous)
                              previous = v
                          }
                          // Nothing in range may be missing: the count is the span over the step.
                          val expected = Math.floor(max / interval).toLong() - Math.ceil(min / interval).toLong() + 1L
                          assertEquals("interval $interval offset $offset: wrong count", expected, values.size.toLong())
                      }
                  }
              }

              @Test
              fun `the guard caps output without dropping the start of the run`() {
                  val values = gridLineValues(min = 0.0, max = 1_000_000.0, interval = 10, guard = 5)
                  assertArrayEquals(longArrayOf(0L, 10L, 20L, 30L, 40L), values)
              }

              @Test
              fun `nonsense input yields no lines rather than an exception`() {
                  assertEquals(0L, gridLineValues(min = 0.0, max = 100.0, interval = 0).size.toLong())
                  assertEquals(0L, gridLineValues(min = 0.0, max = 100.0, interval = -10).size.toLong())
                  assertEquals(0L, gridLineValues(min = 100.0, max = 0.0, interval = 10).size.toLong())
                  assertEquals(0L, gridLineValues(min = Double.NaN, max = 100.0, interval = 10).size.toLong())
                  assertEquals(0L, gridLineValues(min = 0.0, max = Double.POSITIVE_INFINITY, interval = 10).size.toLong())
              }

              @Test
              fun `nonsense input does not crash the chooser`() {
                  assertEquals(0L, chooseGridInterval(metersPerPixel = 0.0, density = 2f).toLong())
                  assertEquals(0L, chooseGridInterval(metersPerPixel = -1.0, density = 2f).toLong())
                  assertEquals(0L, chooseGridInterval(metersPerPixel = 1.0, density = 0f).toLong())
              }

              @Test
              fun `every interval the chooser can return has a label`() {
                  // Guards the two lists drifting apart: a new interval with no label
                  // would silently render as "10 m" on the readout.
                  val named = mapOf(
                      0 to "GZD", 100000 to "100 km", 10000 to "10 km",
                      1000 to "1 km", 100 to "100 m", 10 to "10 m",
                  )
                  val seen = mutableSetOf<Int>()
                  var mpp = 0.01
                  while (mpp < 100000.0) {
                      seen += chooseGridInterval(mpp, 2f)
                      mpp *= 1.2
                  }
                  for (i in seen) {
                      assertEquals("interval $i", named.getValue(i), gridIntervalLabel(i))
                  }
                  assertTrue("chooser should exercise more than one interval", seen.size > 3)
              }

              // ---- Calibrated image quad (roadmap A / C) -----------------------------

              @Test
              fun `an image quad needs exactly four corners`() {
                  val ok = ImageQuad(
                      id = "a", name = "sketch",
                      corners = listOf(1.0 to 1.0, 1.0 to 2.0, 2.0 to 2.0, 2.0 to 1.0),
                  )
                  assertEquals(4L, ok.corners.size.toLong())
                  assertEquals(1f, ok.opacity, 0f)
                  assertTrue(ok.visible)
                  for (bad in listOf(0, 1, 3, 5)) {
                      val corners = List(bad) { 0.0 to 0.0 }
                      var threw = false
                      try {
                          ImageQuad(id = "b", name = "bad", corners = corners)
                      } catch (e: IllegalArgumentException) {
                          threw = true
                      }
                      assertTrue("$bad corners should be rejected", threw)
                  }
              }

              @Test
              fun `a grid line defaults to the metre grid and is not heavy`() {
                  val line = GridLine(points = listOf(0.0 to 0.0, 0.0 to 1.0))
                  assertEquals(GridLine.Kind.METRE, line.kind)
                  assertTrue(!line.heavy)
              }

              // ---- Elevation cache trim ---------------------------------------------

              private fun store(root: File) = object : ElevationStore {
                  override val dir: File = root
              }

              @Test
              fun `trim removes the oldest tiles beyond the cap`() {
                  val dir = temp.newFolder("dem")
                  val s = store(dir)
                  for (i in 0 until 10) {
                      val f = s.fileFor(12, i, 0)
                      f.writeBytes(ByteArray(4))
                      f.setLastModified(1_000_000_000L + i * 60_000L)
                  }
                  assertEquals(4L, s.trimOldest(maxFiles = 6).toLong())
                  val left = dir.listFiles()!!.map { it.name }.sorted()
                  assertEquals(6L, left.size.toLong())
                  assertTrue("oldest should be gone", "12_0_0.png" !in left)
                  assertTrue("newest should stay", "12_9_0.png" in left)
              }

              @Test
              fun `trim is a no-op under the cap and on a missing directory`() {
                  val dir = temp.newFolder("dem2")
                  val s = store(dir)
                  assertEquals(0L, s.trimOldest(maxFiles = 400).toLong())
                  s.fileFor(10, 1, 1).writeBytes(ByteArray(1))
                  assertEquals(0L, s.trimOldest(maxFiles = 400).toLong())
                  assertEquals(0L, store(File(dir, "nope")).trimOldest().toLong())
              }

              @Test
              fun `trim ignores files that are not tiles`() {
                  val dir = temp.newFolder("dem3")
                  val s = store(dir)
                  for (i in 0 until 5) s.fileFor(9, i, 0).writeBytes(ByteArray(1))
                  File(dir, "notes.txt").writeText("keep me")
                  assertEquals(3L, s.trimOldest(maxFiles = 2).toLong())
                  assertTrue(File(dir, "notes.txt").exists())
              }

              @Test
              fun `tile paths are stable and the default cap is what the prefetch assumes`() {
                  val dir = temp.newFolder("dem4")
                  assertEquals("12_345_678.png", store(dir).fileFor(12, 345, 678).name)
                  assertEquals(400L, ELEVATION_MAX_CACHED_TILES.toLong())
              }
          }
          EOF_GRIDFIX
          echo "v0.9.22-d3d306265e0d" > .github/last-payload
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.9.22 (landscape map painting fix and the 0.9.20 review cut) source from bootstrap workflow'
            git push origin HEAD:main
          fi
          fi

      - name: Fetch bundled fonts (OFL; committed to main the first time)
        run: |
          mkdir -p app/src/main/res/font
          fetch_font() {  # dest-name  google/fonts path  css2 family spec (fallback)
            local dest="app/src/main/res/font/$1"
            if [ -s "$dest" ]; then echo "have $1"; return 0; fi
            curl -fsSL --retry 3 -o "$dest" "https://raw.githubusercontent.com/google/fonts/main/ofl/$2" || rm -f "$dest"
            if [ ! -s "$dest" ] && [ -n "$3" ]; then
              url=$(curl -fsSL -A 'curl/8' "https://fonts.googleapis.com/css2?family=$3" | grep -o 'https://fonts.gstatic.com[^)]*\.ttf' | head -1)
              if [ -n "$url" ]; then curl -fsSL --retry 3 -o "$dest" "$url" || rm -f "$dest"; fi
            fi
            if [ ! -s "$dest" ]; then echo "ERROR: could not fetch font $1"; exit 1; fi
            case "$(head -c 4 "$dest" | od -An -tx1 | tr -d ' \n')" in
              00010000|74727565|4f54544f) ;;
              *) echo "ERROR: $1 is not a TrueType/OpenType file:"; head -c 300 "$dest"; echo; exit 1 ;;
            esac
            echo "fetched $1 ($(wc -c < "$dest") bytes)"
          }
          fetch_font antonio.ttf 'antonio/Antonio%5Bwght%5D.ttf' 'Antonio:wght@700'
          fetch_font saira_semi_condensed_regular.ttf 'sairasemicondensed/SairaSemiCondensed-Regular.ttf' 'Saira+Semi+Condensed'
          fetch_font saira_semi_condensed_medium.ttf 'sairasemicondensed/SairaSemiCondensed-Medium.ttf' 'Saira+Semi+Condensed:wght@500'
          fetch_font saira_semi_condensed_semibold.ttf 'sairasemicondensed/SairaSemiCondensed-SemiBold.ttf' 'Saira+Semi+Condensed:wght@600'
          fetch_font saira_semi_condensed_bold.ttf 'sairasemicondensed/SairaSemiCondensed-Bold.ttf' 'Saira+Semi+Condensed:wght@700'
          fetch_font fira_mono_regular.ttf 'firamono/FiraMono-Regular.ttf' 'Fira+Mono'
          fetch_font fira_mono_medium.ttf 'firamono/FiraMono-Medium.ttf' 'Fira+Mono:wght@500'
          fetch_font fira_mono_bold.ttf 'firamono/FiraMono-Bold.ttf' 'Fira+Mono:wght@700'
          # No commit here: the wrapper step makes one commit for everything the
          # bootstrap touched, so a concurrent push to main can only lose one race.
          echo "fonts step done"

      - name: Materialize symbol tree from icon pack (only when symbols are missing)
        run: |
          HAVE=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$HAVE" -ge 112 ]; then
            echo "$HAVE NATO symbols already committed - nothing to materialize"
            exit 0
          fi
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: symbols are missing and Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Commit the Gradle wrapper (once, so a clone builds without a Gradle install)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
            chmod +x gradlew
          fi
          # One commit for anything the bootstrap generated this run (fonts, wrapper).
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Bootstrap assets: Gradle wrapper and bundled fonts'
            git push origin HEAD:main
          fi
          ls -l gradlew

      - name: Unit tests (field math)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log | tail -n 60

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build signed release AAB for Play (needs keystore secrets)
        id: aab
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_B64 secret set - skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tail -n 80
          cp app/build/outputs/bundle/release/app-release.aab gridfix-release.aab
          echo "signed release AAB ready: gridfix-release.aab"

      - name: Build signed release APK (the same R8 output as the AAB, installable for a smoke test)
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No keystore secret - skipping release APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -n 40
          cp app/build/outputs/apk/release/app-release.apk gridfix-release.apk
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then cp "$MAP" gridfix-mapping.txt; fi
          echo "release APK ready (minified) - install this to smoke-test what Play will ship"

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          COMBINED=failure
          if [ "$OUTCOME" = "success" ] && [ "${{ steps.tests.outcome }}" = "success" ]; then
            COMBINED=success
          fi
          {
            echo "outcome=$COMBINED"
            echo "build=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          tail -n 200 "$GITHUB_WORKSPACE/test.log" > testlog.txt 2>/dev/null || echo "no test log" > testlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          EXTRA=""
          if [ -f gridfix-release.aab ]; then EXTRA="gridfix-release.aab"; fi
          if [ -f gridfix-release.apk ]; then EXTRA="$EXTRA gridfix-release.apk"; fi
          if [ -f gridfix-mapping.txt ]; then EXTRA="$EXTRA gridfix-mapping.txt"; fi
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk $EXTRA \
            --title "MGRS GPS build ${{ github.run_number }}" \
            --notes 'Phone install: tap gridfix-debug.apk below, allow the install, open MGRS GPS. gridfix-release.aab (when present) is the signed bundle to upload to Play Console - do not install it on a phone.'
          # Keep a permanent copy of every build under its version, for rollback
          VN=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          gh release create "v${VN}-b${{ github.run_number }}" gridfix-debug.apk $EXTRA \
            --prerelease \
            --title "MGRS GPS v${VN} (build ${{ github.run_number }})" \
            --notes 'Archived build. The latest release is the one to install day to day.' || true

      - name: Fail the job if the build or the field-math tests failed
        if: steps.gradle.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "build=${{ steps.gradle.outcome }} tests=${{ steps.tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "--- failing tests ---"
            grep -A 4 -E "FAILED|AssertionError" test.log | tail -n 60 || true
          fi
          exit 1
