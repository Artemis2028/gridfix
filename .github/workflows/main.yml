name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.21 (release-build hotfix, lifecycle 2.8.5 and R8 keep rules) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.21-3e51955c2a17" ]; then
            echo "payload v0.9.21-3e51955c2a17 already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 49
                  versionName = "0.9.21"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              // 2.8.3+ only. With Compose 1.6 (this BOM), lifecycle 2.8's LocalLifecycleOwner
              // finds Compose UI's copy by REFLECTION, and 2.8.2 shipped no keep rule for
              // it: the debug build ran, the R8 build died on first composition with
              // "CompositionLocal LocalLifecycleOwner not present" (lifecycle b/346808608,
              // fixed 2.8.3). 2.8.5 is the last 2.8.x before the Compose Runtime 1.7.1
              // dependency; do not go past it without moving the BOM to Compose 1.7.
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
              // org.json ships in android.jar as a stub that returns defaults under
              // isReturnDefaultValues, so a JVM test cannot parse its own output
              // without the real artifact on the test classpath ahead of it.
              testImplementation("org.json:json:20240303")
          }
          EOF_GRIDFIX
          mkdir -p 'app'
          cat > 'app/proguard-rules.pro' <<'EOF_GRIDFIX'
          # MGRS GPS release rules.
          #
          # The app has no reflection of its own, but four dependencies do, and R8 cannot
          # see through them. Everything here is deliberately conservative: a wrong strip
          # shows up as a crash on a tester's phone, not as a build failure.

          # --- osmdroid ---------------------------------------------------------------
          # Tile sources and overlays are constructed reflectively from configuration,
          # and the library ships its own resources/preferences machinery.
          -keep class org.osmdroid.** { *; }
          -dontwarn org.osmdroid.**

          # --- NGA MGRS / grid libraries ----------------------------------------------
          # Property files and enum valueOf() lookups drive the grid definitions.
          -keep class mil.nga.** { *; }
          -dontwarn mil.nga.**

          # --- Google Play Billing -----------------------------------------------------
          # Billing responses are parsed into library classes by name.
          -keep class com.android.billingclient.** { *; }
          -dontwarn com.android.billingclient.**

          # --- ZXing -------------------------------------------------------------------
          -keep class com.google.zxing.** { *; }
          -dontwarn com.google.zxing.**

          # --- Lifecycle 2.8 on Compose 1.6 --------------------------------------------
          # lifecycle-runtime-compose 2.8.x resolves LocalLifecycleOwner on Compose UI 1.6
          # by Class.forName("androidx.compose.ui.platform.AndroidCompositionLocals_androidKt")
          # .getMethod("getLocalLifecycleOwner"). Obfuscate that class and every
          # collectAsStateWithLifecycle() throws "CompositionLocal LocalLifecycleOwner not
          # present" - on the release build only, which is how 0.9.20's release APK died
          # on launch. 2.8.3+ ships this rule in the AAR; it is repeated here so a future
          # dependency change cannot silently drop it again.
          -if public class androidx.compose.ui.platform.AndroidCompositionLocals_androidKt
          -keep public class androidx.compose.ui.platform.AndroidCompositionLocals_androidKt {
              public static *** getLocalLifecycleOwner();
          }

          # --- Kotlin / coroutines -----------------------------------------------------
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -dontwarn kotlinx.coroutines.**

          # Enum valueOf/values() are used by DataStore-backed settings round-trips.
          -keepclassmembers enum * {
              public static **[] values();
              public static ** valueOf(java.lang.String);
          }

          # Keep our own data classes intact: they are serialised to JSON by property
          # name in backups and interchange files.
          -keep class app.gridfix.android.data.** { *; }

          # Line numbers make a Play crash report readable once mapping.txt is uploaded.
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile
          EOF_GRIDFIX
          mkdir -p 'app/src/main/res/raw'
          cat > 'app/src/main/res/raw/keep.xml' <<'EOF_GRIDFIX'
          <?xml version="1.0" encoding="utf-8"?>
          <!--
            Resource-shrinker keep list for the release build.

            The 112 NATO symbol PNGs in drawable-nodpi are looked up BY NAME at runtime
            (NatoSymbols.resId -> Resources.getIdentifier("nato_<aff>_<func>")), never by
            R.drawable constant, so nothing in the code references them statically. The
            shrinker's safe mode is supposed to infer the "nato_" prefix from the string
            constant next to getIdentifier(); this makes that explicit so a symbol set
            cannot vanish from a release build on a heuristic.
          -->
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/nato_*" />
          EOF_GRIDFIX
          echo "v0.9.21-3e51955c2a17" > .github/last-payload
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.9.21 (release-build hotfix, lifecycle 2.8.5 and R8 keep rules) source from bootstrap workflow'
            git push origin HEAD:main
          fi
          fi

      - name: Fetch bundled fonts (OFL; committed to main the first time)
        run: |
          mkdir -p app/src/main/res/font
          fetch_font() {  # dest-name  google/fonts path  css2 family spec (fallback)
            local dest="app/src/main/res/font/$1"
            if [ -s "$dest" ]; then echo "have $1"; return 0; fi
            curl -fsSL --retry 3 -o "$dest" "https://raw.githubusercontent.com/google/fonts/main/ofl/$2" || rm -f "$dest"
            if [ ! -s "$dest" ] && [ -n "$3" ]; then
              url=$(curl -fsSL -A 'curl/8' "https://fonts.googleapis.com/css2?family=$3" | grep -o 'https://fonts.gstatic.com[^)]*\.ttf' | head -1)
              if [ -n "$url" ]; then curl -fsSL --retry 3 -o "$dest" "$url" || rm -f "$dest"; fi
            fi
            if [ ! -s "$dest" ]; then echo "ERROR: could not fetch font $1"; exit 1; fi
            case "$(head -c 4 "$dest" | od -An -tx1 | tr -d ' \n')" in
              00010000|74727565|4f54544f) ;;
              *) echo "ERROR: $1 is not a TrueType/OpenType file:"; head -c 300 "$dest"; echo; exit 1 ;;
            esac
            echo "fetched $1 ($(wc -c < "$dest") bytes)"
          }
          fetch_font antonio.ttf 'antonio/Antonio%5Bwght%5D.ttf' 'Antonio:wght@700'
          fetch_font saira_semi_condensed_regular.ttf 'sairasemicondensed/SairaSemiCondensed-Regular.ttf' 'Saira+Semi+Condensed'
          fetch_font saira_semi_condensed_medium.ttf 'sairasemicondensed/SairaSemiCondensed-Medium.ttf' 'Saira+Semi+Condensed:wght@500'
          fetch_font saira_semi_condensed_semibold.ttf 'sairasemicondensed/SairaSemiCondensed-SemiBold.ttf' 'Saira+Semi+Condensed:wght@600'
          fetch_font saira_semi_condensed_bold.ttf 'sairasemicondensed/SairaSemiCondensed-Bold.ttf' 'Saira+Semi+Condensed:wght@700'
          fetch_font fira_mono_regular.ttf 'firamono/FiraMono-Regular.ttf' 'Fira+Mono'
          fetch_font fira_mono_medium.ttf 'firamono/FiraMono-Medium.ttf' 'Fira+Mono:wght@500'
          fetch_font fira_mono_bold.ttf 'firamono/FiraMono-Bold.ttf' 'Fira+Mono:wght@700'
          # No commit here: the wrapper step makes one commit for everything the
          # bootstrap touched, so a concurrent push to main can only lose one race.
          echo "fonts step done"

      - name: Materialize symbol tree from icon pack (only when symbols are missing)
        run: |
          HAVE=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$HAVE" -ge 112 ]; then
            echo "$HAVE NATO symbols already committed - nothing to materialize"
            exit 0
          fi
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: symbols are missing and Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Commit the Gradle wrapper (once, so a clone builds without a Gradle install)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
            chmod +x gradlew
          fi
          # One commit for anything the bootstrap generated this run (fonts, wrapper).
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Bootstrap assets: Gradle wrapper and bundled fonts'
            git push origin HEAD:main
          fi
          ls -l gradlew

      - name: Unit tests (field math)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log | tail -n 60

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build signed release AAB for Play (needs keystore secrets)
        id: aab
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_B64 secret set - skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tail -n 80
          cp app/build/outputs/bundle/release/app-release.aab gridfix-release.aab
          echo "signed release AAB ready: gridfix-release.aab"

      - name: Build signed release APK (the same R8 output as the AAB, installable for a smoke test)
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No keystore secret - skipping release APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -n 40
          cp app/build/outputs/apk/release/app-release.apk gridfix-release.apk
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then cp "$MAP" gridfix-mapping.txt; fi
          echo "release APK ready (minified) - install this to smoke-test what Play will ship"

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          COMBINED=failure
          if [ "$OUTCOME" = "success" ] && [ "${{ steps.tests.outcome }}" = "success" ]; then
            COMBINED=success
          fi
          {
            echo "outcome=$COMBINED"
            echo "build=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          tail -n 200 "$GITHUB_WORKSPACE/test.log" > testlog.txt 2>/dev/null || echo "no test log" > testlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          EXTRA=""
          if [ -f gridfix-release.aab ]; then EXTRA="gridfix-release.aab"; fi
          if [ -f gridfix-release.apk ]; then EXTRA="$EXTRA gridfix-release.apk"; fi
          if [ -f gridfix-mapping.txt ]; then EXTRA="$EXTRA gridfix-mapping.txt"; fi
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk $EXTRA \
            --title "MGRS GPS build ${{ github.run_number }}" \
            --notes 'Phone install: tap gridfix-debug.apk below, allow the install, open MGRS GPS. gridfix-release.aab (when present) is the signed bundle to upload to Play Console - do not install it on a phone.'
          # Keep a permanent copy of every build under its version, for rollback
          VN=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          gh release create "v${VN}-b${{ github.run_number }}" gridfix-debug.apk $EXTRA \
            --prerelease \
            --title "MGRS GPS v${VN} (build ${{ github.run_number }})" \
            --notes 'Archived build. The latest release is the one to install day to day.' || true

      - name: Fail the job if the build or the field-math tests failed
        if: steps.gradle.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "build=${{ steps.gradle.outcome }} tests=${{ steps.tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "--- failing tests ---"
            grep -A 4 -E "FAILED|AssertionError" test.log | tail -n 60 || true
          fi
          exit 1
