name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.16 (store readiness, R8, tests) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.16-eb5d6eaf0174" ]; then
            echo "payload v0.9.16-eb5d6eaf0174 already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p '.'
          cat > 'LICENSE' <<'EOF_GRIDFIX'
