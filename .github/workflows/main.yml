name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.27 (multi-select with batch visibility swap and batch delete) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.27-ee5449795a09" ]; then
            echo "payload v0.9.27-ee5449795a09 already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 55
                  versionName = "0.9.27"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              // 2.8.3+ only. With Compose 1.6 (this BOM), lifecycle 2.8's LocalLifecycleOwner
              // finds Compose UI's copy by REFLECTION, and 2.8.2 shipped no keep rule for
              // it: the debug build ran, the R8 build died on first composition with
              // "CompositionLocal LocalLifecycleOwner not present" (lifecycle b/346808608,
              // fixed 2.8.3). 2.8.5 is the last 2.8.x before the Compose Runtime 1.7.1
              // dependency; do not go past it without moving the BOM to Compose 1.7.
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
              // org.json ships in android.jar as a stub that returns defaults under
              // isReturnDefaultValues, so a JVM test cannot parse its own output
              // without the real artifact on the test classpath ahead of it.
              testImplementation("org.json:json:20240303")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/GraphicsRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          private val Context.graphicsStore by preferencesDataStore(
              name = "graphics",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** A simple lat/lon vertex for tactical graphics. */
          data class GeoVertex(val lat: Double, val lon: Double)

          /**
           * A tactical control-measure graphic drawn on the map.
           * Types: phase_line, boundary, axis, doa, objective, aa, route.
           * Area types (objective, aa) are closed automatically when rendered.
           */
          data class TacGraphic(
              val id: String,
              val name: String,
              val type: String,
              val points: List<GeoVertex>,
              val folder: String = DEFAULT_FOLDER,
              val affiliation: String = "none",
              val createdAt: Long = 0L,
              val echelon: String = "",   // boundary lines carry the echelon mark on the line
              /** Drawn on the map, or held but hidden. See [Waypoint.visible]. */
              val visible: Boolean = true,
          )

          object GraphicTypes {
              /** type key -> (label, minimum vertices, isArea) */
              val all = listOf(
                  Triple("phase_line", "Phase line", 2),
                  Triple("boundary", "Boundary", 2),
                  Triple("axis", "Axis of advance", 2),
                  Triple("doa", "Direction of attack", 2),
                  Triple("objective", "Objective", 3),
                  Triple("aa", "Assembly area", 3),
                  Triple("route", "Route", 2),
                  Triple("lz", "Landing zone", 3),
                  Triple("pz", "Pickup zone", 3),
                  Triple("bp", "Battle position", 3),
                  Triple("ea", "Engagement area", 3),
                  Triple("nai", "NAI", 3),
                  Triple("tai", "TAI", 3),
                  Triple("area", "Area (sketch)", 3),
                  Triple("screen_l", "Screen line", 2),
                  Triple("guard_l", "Guard line", 2),
                  Triple("cover_l", "Cover line", 2),
                  Triple("flot", "FLOT", 2),
                  Triple("obstacle_line", "Obstacle line", 2),
                  Triple("wire", "Wire obstacle", 2),
                  Triple("lane", "Lane", 2),
                  Triple("minefield", "Minefield", 3),
                  Triple("strongpoint", "Strongpoint", 3),
                  Triple("roadblock", "Roadblock", 1),
                  Triple("ring", "Range ring", 2),
                  Triple("sector", "Sector of fire", 3),
                  Triple("trp", "Target ref point", 1),
                  Triple("checkpoint", "Checkpoint", 1),
                  Triple("dp", "Decision point", 1),
                  Triple("text", "Text label", 1),
              )

              fun label(type: String): String = all.firstOrNull { it.first == type }?.second ?: type

              fun minPoints(type: String): Int = all.firstOrNull { it.first == type }?.third ?: 2

              fun isArea(type: String): Boolean = type in setOf(
                  "objective", "aa", "lz", "pz", "area", "bp", "ea", "nai", "tai",
                  "minefield", "strongpoint",
              )

              /** Security line graphics: letter box mid-line, arrows outward both ends. */
              fun securityLetter(type: String): String? = when (type) {
                  "screen_l" -> "S"
                  "guard_l" -> "G"
                  "cover_l" -> "C"
                  else -> null
              }

              /**
               * Types placed with a fixed number of taps finish themselves — no Done press.
               * Ring: center then range edge. Sector: apex, left limit, right limit.
               */
              fun fixedPoints(type: String): Int? = when (type) {
                  "ring" -> 2
                  "sector" -> 3
                  "trp", "checkpoint", "dp", "text", "roadblock" -> 1
                  else -> null
              }

              /** Placement hint shown when the type is picked. */
              fun placeHint(type: String): String? = when (type) {
                  "ring" -> "Tap the center, then the range edge"
                  "sector" -> "Tap the apex, then left limit, then right limit"
                  "trp", "checkpoint", "dp", "roadblock" -> "Tap the map to place it"
                  "text" -> "Tap the map where the text goes"
                  "screen_l", "guard_l", "cover_l" -> "Tap along the security line, then Done"
                  "flot" -> "Trace your forward line — the scallops face left of your drawing direction (toward the enemy)"
                  "lane" -> "Trace the cleared lane's centerline"
                  "obstacle_line", "wire" -> "Trace along the obstacle"
                  else -> null
              }

              /** Display prefix used in the on-map label, per doctrine shorthand. */
              fun labelPrefix(type: String): String = when (type) {
                  "phase_line" -> "PL "
                  "objective" -> "OBJ "
                  "aa" -> "AA "
                  "lz" -> "LZ "
                  "pz" -> "PZ "
                  "bp" -> "BP "
                  "ea" -> "EA "
                  "nai" -> "NAI "
                  "tai" -> "TAI "
                  "trp" -> "TRP "
                  "checkpoint" -> "CP "
                  "dp" -> "DP "
                  else -> ""
              }
          }

          class GraphicsRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val graphics: Flow<List<TacGraphic>> = context.graphicsStore.data.map { p ->
                  decode(p[listKey] ?: "[]")
              }

              suspend fun add(
                  name: String,
                  type: String,
                  points: List<GeoVertex>,
                  folder: String,
                  affiliation: String,
                  nowMillis: Long,
                  echelon: String = "",
              ): String {
                  val g = TacGraphic(
                      id = UUID.randomUUID().toString(),
                      name = name.trim(),
                      type = type,
                      points = points,
                      folder = canonicalFolder(folder),
                      affiliation = affiliation,
                      createdAt = nowMillis,
                      echelon = echelon,
                  )
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + g)
                  }
                  return g.id
              }

              suspend fun rename(
                  id: String,
                  name: String,
                  folder: String,
                  affiliation: String,
                  echelon: String = "",
              ) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name.trim(),
                                  folder = canonicalFolder(folder),
                                  affiliation = affiliation,
                                  echelon = echelon,
                              ) else it
                          }
                      )
                  }
              }

              /** Merge a backup by id — already-present graphics are skipped. Returns added count. */
              suspend fun restore(imported: List<TacGraphic>): Int {
                  var added = 0
                  context.graphicsStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      val ids = current.map { it.id }.toSet()
                      val fresh = imported.filter { it.id !in ids }
                      added = fresh.size
                      p[listKey] = encode(current + fresh)
                  }
                  return added
              }

              /** Replace a graphic's vertices — the map's edit-points mode saves through this. */
              suspend fun updatePoints(id: String, points: List<GeoVertex>) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(points = points) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
              }

              /**
               * Show or hide one graphic on the map without deleting it, independently of its
               * folder's eye. The list still shows it, marked hidden.
               */
              suspend fun setVisible(id: String, visible: Boolean) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").map { if (it.id == id) it.copy(visible = visible) else it })
                  }
              }

              /**
               * Flip the eye on each of [ids] **individually** - a mixed selection swaps, it does
               * not get forced to one value. Selecting some shown and some hidden graphics and
               * tapping the eye is how you exchange one set for the other in a single gesture,
               * which is the whole point of the action.
               *
               * One transaction for the batch: the store is a single JSON blob, so N calls to
               * [setVisible] would rewrite the whole list N times.
               */
              suspend fun toggleVisible(ids: Set<String>) {
                  if (ids.isEmpty()) return
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map { if (it.id in ids) it.copy(visible = !it.visible) else it }
                      )
                  }
              }

              /** Delete every id in [ids] in one transaction. */
              suspend fun deleteAll(ids: Set<String>) {
                  if (ids.isEmpty()) return
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id in ids })
                  }
              }

              /** Move every graphic in [from] to [to] (folder rename, or emptying a folder into Base). */
              suspend fun renameFolder(from: String, to: String) {
                  val target = canonicalFolder(to)
                  if (from == target) return
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").map { if (it.folder == from) it.copy(folder = target) else it })
                  }
              }

              /** Remove every graphic in [folder] — "clear the sketch" in one go. */
              suspend fun deleteFolder(folder: String) {
                  context.graphicsStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.folder == folder })
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TacGraphic> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              val pts = o.getJSONArray("points")
                              val vertices = buildList {
                                  for (j in 0 until pts.length()) {
                                      val v = pts.getJSONArray(j)
                                      add(GeoVertex(v.getDouble(0), v.getDouble(1)))
                                  }
                              }
                              TacGraphic(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  type = o.getString("type"),
                                  points = vertices,
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                                  affiliation = o.optString("affiliation", "none"),
                                  createdAt = o.optLong("createdAt"),
                                  echelon = o.optString("echelon", ""),
                                  visible = o.optBoolean("visible", true),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TacGraphic>): String {
                  val arr = JSONArray()
                  for (g in list) {
                      val pts = JSONArray()
                      for (v in g.points) {
                          pts.put(JSONArray().put(v.lat).put(v.lon))
                      }
                      arr.put(
                          JSONObject()
                              .put("id", g.id)
                              .put("name", g.name)
                              .put("type", g.type)
                              .put("points", pts)
                              .put("folder", g.folder)
                              .put("affiliation", g.affiliation)
                              .put("createdAt", g.createdAt)
                              .put("echelon", g.echelon)
                              .put("visible", g.visible)
                      )
                  }
                  return arr.toString()
              }
          }
          EOF_GRIDFIX
          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import app.gridfix.android.coords.Geodesy
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(
              name = "tracks",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
              val folder: String = DEFAULT_FOLDER,   // overlay folder, shares the eye switch with waypoints and graphics
              /** Drawn on the map, or held but hidden. See [Waypoint.visible]. */
              val visible: Boolean = true,
          )

          /**
           * A logged fix. [alt] is metres above mean sea level, or [NO_ALTITUDE] when the
           * receiver gave no height: writing a real number there would put the leg at sea
           * level on every profile that reads it.
           */
          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          /** "this fix had no altitude" — omitted from GPX rather than written as a height. */
          const val NO_ALTITUDE = -32768.0

          fun Double.hasAltitude(): Boolean = this > NO_ALTITUDE + 1.0

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      dist += Geodesy.distanceAndBearing(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon
                      )[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      dist += Geodesy.distanceAndBearing(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon
                      )[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Restore one track from a backup, keeping its id; skipped when already present. */
              suspend fun restore(info: TrackInfo, points: List<TrackPoint>): Boolean {
                  var added = false
                  context.trackStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      if (current.none { it.id == info.id }) {
                          val f = pointsFile(context, info.id)
                          f.parentFile?.mkdirs()
                          f.writeText(
                              points.joinToString("") {
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                              }
                          )
                          p[listKey] = encode(current + info)
                          added = true
                      }
                  }
                  return added
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun setFolder(id: String, folder: String) {
                  val clean = canonicalFolder(folder)
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(folder = clean) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /**
               * Show or hide one track on the map without deleting it, independently of its
               * folder's eye. The list still shows it, marked hidden.
               */
              suspend fun setVisible(id: String, visible: Boolean) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").map { if (it.id == id) it.copy(visible = visible) else it })
                  }
              }

              /**
               * Flip the eye on each of [ids] **individually** - a mixed selection swaps, it does
               * not get forced to one value. Selecting some shown and some hidden tracks and
               * tapping the eye is how you exchange one set for the other in a single gesture,
               * which is the whole point of the action.
               *
               * One transaction for the batch: the store is a single JSON blob, so N calls to
               * [setVisible] would rewrite the whole list N times.
               */
              suspend fun toggleVisible(ids: Set<String>) {
                  if (ids.isEmpty()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map { if (it.id in ids) it.copy(visible = !it.visible) else it }
                      )
                  }
              }

              /** Delete every id in [ids] in one transaction. */
              suspend fun deleteAll(ids: Set<String>) {
                  if (ids.isEmpty()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id in ids })
                  }
                  // The log files go with them, after the store is written: a leftover file is
