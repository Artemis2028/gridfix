name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.29 (crash report prompt on the launch after a crash) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.29-c77f618fdc3d" ]; then
            echo "payload v0.9.29-c77f618fdc3d already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 57
                  versionName = "0.9.29"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              // 2.8.3+ only. With Compose 1.6 (this BOM), lifecycle 2.8's LocalLifecycleOwner
              // finds Compose UI's copy by REFLECTION, and 2.8.2 shipped no keep rule for
              // it: the debug build ran, the R8 build died on first composition with
              // "CompositionLocal LocalLifecycleOwner not present" (lifecycle b/346808608,
              // fixed 2.8.3). 2.8.5 is the last 2.8.x before the Compose Runtime 1.7.1
              // dependency; do not go past it without moving the BOM to Compose 1.7.
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
              // org.json ships in android.jar as a stub that returns defaults under
              // isReturnDefaultValues, so a JVM test cannot parse its own output
              // without the real artifact on the test classpath ahead of it.
              testImplementation("org.json:json:20240303")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android'
          cat > 'app/src/main/java/app/gridfix/android/CrashLog.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android

          import android.content.Context
          import android.os.Build
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone

          /**
           * Catch a fatal crash, keep it on the phone, and offer it to the user next launch.
           *
           * Why this exists at all, given Android vitals already collects crashes: vitals only
           * sees installs from Play, only from users who opted in to sharing diagnostics, and it
           * never carries the one thing that makes a report actionable - what the person was
           * doing. During a closed test that gap is the difference between "0.3% crash rate" and
           * a fix.
           *
           * Two rules this class must not break:
           *
           *  1. **It always hands the crash on to the previous handler.** Play's handler is what
           *     puts the crash in vitals, deobfuscated against the mapping in the AAB. Swallowing
           *     it here would trade an automatic, aggregated, symbolicated report for one email a
           *     tester may never send. This is an addition, never a replacement.
           *  2. **Nothing leaves the phone on its own.** The trace is written to app-private
           *     storage and stays there until the user taps Send, which opens their own mail app
           *     with the text in the body. The app has no servers to send it to and this does not
           *     change that.
           */
          object CrashLog {

              private const val FILE_NAME = "last-crash.txt"

              /** Enough to identify any crash; a mailto body much past this starts to be refused. */
              private const val MAX_CHARS = 4000

              /**
               * Install the handler. Called once, as early as possible, so a crash during startup
               * is caught too.
               */
              fun install(context: Context) {
                  val app = context.applicationContext
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      // Anything thrown in here would replace the real crash with a worse one.
                      runCatching { write(app, thread, error) }
                      previous?.uncaughtException(thread, error)
                  }
              }

              /** The saved report, or null when the last run ended normally. */
              fun pending(context: Context): String? = runCatching {
                  val f = File(context.filesDir, FILE_NAME)
                  if (f.isFile && f.length() > 0L) f.readText() else null
              }.getOrNull()

              /** Forget it, whether it was sent or discarded — it is only ever offered once. */
              fun clear(context: Context) {
                  runCatching { File(context.filesDir, FILE_NAME).delete() }
              }

              private fun write(context: Context, thread: Thread, error: Throwable) {
                  val trace = StringWriter().also { error.printStackTrace(PrintWriter(it)) }.toString()
                  val stamp = SimpleDateFormat("yyyy-MM-dd HH:mm:ss 'UTC'", Locale.US)
                      .apply { timeZone = TimeZone.getTimeZone("UTC") }
                      .format(Date())
                  val text = buildString {
                      append("MGRS GPS ").append(BuildConfig.VERSION_NAME)
                      append(" (build ").append(BuildConfig.VERSION_CODE).append(")\n")
                      append(Build.MANUFACTURER).append(' ').append(Build.MODEL)
                      append(" — Android ").append(Build.VERSION.RELEASE)
                      append(" (API ").append(Build.VERSION.SDK_INT).append(")\n")
                      append("Thread: ").append(thread.name).append('\n')
                      append("When:   ").append(stamp).append('\n')
                      append('\n')
                      append(trace)
                  }
                  File(context.filesDir, FILE_NAME).writeText(
                      if (text.length <= MAX_CHARS) text else text.take(MAX_CHARS) + "\n… trace truncated"
                  )
              }
          }
          EOF_GRIDFIX
          cat > 'app/src/main/java/app/gridfix/android/MainActivity.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import app.gridfix.android.ui.GridFixApp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Before anything else, so a crash during startup is caught as well.
                  CrashLog.install(this)
                  enableEdgeToEdge()
                  setContent {
                      GridFixApp()
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/ui'
