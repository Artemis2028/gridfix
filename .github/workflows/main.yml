name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.19 (portable slices, Vincenty, shared golden vectors) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.19-e77ff18d578b" ]; then
            echo "payload v0.9.19-e77ff18d578b already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 47
                  versionName = "0.9.19"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/coords'
          cat > 'app/src/main/java/app/gridfix/android/coords/Coordinates.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.coords

          import mil.nga.grid.features.Point
          import mil.nga.mgrs.MGRS
          import mil.nga.mgrs.grid.GridType
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.cos
          import kotlin.math.floor
          import kotlin.math.pow
          import kotlin.math.roundToLong
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.math.tan

          object Coordinates {

              data class MgrsParts(
                  val gzd: String,
                  val square: String,
                  val easting: String,
                  val northing: String,
                  val full: String,
              )

              /** Lat/lon (WGS84) to MGRS at the requested precision (4/6/8/10 digits). */
              fun mgrs(lat: Double, lon: Double, digits: Int): MgrsParts? = runCatching {
                  val mgrs = MGRS.from(Point.point(lon, lat))
                  val gridType = when (digits) {
                      4 -> GridType.KILOMETER
                      6 -> GridType.HUNDRED_METER
                      8 -> GridType.TEN_METER
                      else -> GridType.METER
                  }
                  // The library formats with the device locale; Arabic/Persian/Bengali phones
                  // would get native digits, which nothing downstream can read. Force ASCII.
                  val full = asciiDigits(mgrs.coordinate(gridType)).uppercase(Locale.US)
                  val match = Regex("^([0-9]{1,2}[A-Z])([A-Z]{2})([0-9]*)$").find(full)
                  if (match != null) {
                      val (gzd, square, num) = match.destructured
                      val half = num.length / 2
                      val e = num.substring(0, half)
                      val n = num.substring(half)
                      // Canonical written form keeps the group breaks: "18T VP 3808 9755"
                      val spaced = if (num.isEmpty()) "$gzd $square" else "$gzd $square $e $n"
                      MgrsParts(gzd, square, e, n, spaced)
                  } else {
                      // Polar regions (no zone number) or unexpected shape: show as-is
                      MgrsParts(full, "", "", "", full)
                  }
              }.getOrNull()

              private fun asciiDigits(s: String): String = buildString(s.length) {
                  for (c in s) {
                      val d = Character.digit(c, 10)
                      append(if (d in 0..9) '0' + d else c)
                  }
              }

              data class UtmCoord(val zone: Int, val hemisphere: Char, val easting: Long, val northing: Long)

              /** Lat/lon (WGS84) to standard UTM. Valid for lat -80..84. */
              fun utm(lat: Double, lon: Double): UtmCoord? {
                  if (lat < -80.0 || lat > 84.0) return null

                  val zone = utmZone(lat, lon)

                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)

                  val latRad = Math.toRadians(lat)
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lonRad = Math.toRadians(lon)

                  val n = a / sqrt(1.0 - e2 * sin(latRad).pow(2))
                  val t = tan(latRad).pow(2)
                  val c = ep2 * cos(latRad).pow(2)
                  val bigA = cos(latRad) * (lonRad - lonOrigin)

                  val m = a * (
                      (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0) * latRad -
                          (3.0 * e2 / 8.0 + 3.0 * e2 * e2 / 32.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(2.0 * latRad) +
                          (15.0 * e2 * e2 / 256.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(4.0 * latRad) -
                          (35.0 * e2 * e2 * e2 / 3072.0) * sin(6.0 * latRad)
                      )

                  val easting = k0 * n * (
                      bigA + (1.0 - t + c) * bigA.pow(3) / 6.0 +
                          (5.0 - 18.0 * t + t * t + 72.0 * c - 58.0 * ep2) * bigA.pow(5) / 120.0
                      ) + 500000.0

                  var northing = k0 * (
                      m + n * tan(latRad) * (
                          bigA.pow(2) / 2.0 +
                              (5.0 - t + 9.0 * c + 4.0 * c * c) * bigA.pow(4) / 24.0 +
                              (61.0 - 58.0 * t + t * t + 600.0 * c - 330.0 * ep2) * bigA.pow(6) / 720.0
                          )
                      )
                  if (lat < 0) northing += 10000000.0

                  return UtmCoord(
                      zone = zone,
                      hemisphere = if (lat >= 0) 'N' else 'S',
                      easting = easting.roundToLong(),
                      northing = northing.roundToLong(),
                  )
              }

              fun formatUtm(u: UtmCoord?): String =
                  if (u == null) "—" else "${u.zone}${u.hemisphere} ${u.easting}E ${u.northing}N"

              /** Lat/lon in the chosen format: 0 = DD, 1 = DDM, 2 = DMS. */
              fun formatLatLon(lat: Double, lon: Double, format: Int): String {
                  fun one(value: Double, positive: Char, negative: Char): String {
                      val hemi = if (value >= 0) positive else negative
                      val v = abs(value)
                      return when (format) {
                          0 -> String.format(Locale.US, "%.5f° %c", v, hemi)
                          2 -> {
                              // work in tenths of arc-seconds so carries propagate cleanly
                              val tenths = (v * 36000.0).roundToLong()
                              val d = tenths / 36000
                              val mm = (tenths % 36000) / 600
                              val s = (tenths % 600) / 10.0
                              String.format(Locale.US, "%d° %02d' %04.1f\" %c", d, mm, s, hemi)
                          }
                          else -> {
                              // work in thousandths of minutes
                              val milli = (v * 60000.0).roundToLong()
                              val d = milli / 60000
                              val mFull = (milli % 60000) / 1000.0
                              String.format(Locale.US, "%d° %06.3f' %c", d, mFull, hemi)
                          }
                      }
                  }
                  return one(lat, 'N', 'S') + "   " + one(lon, 'E', 'W')
              }

              /** Military date-time group in Zulu, e.g. 241435Z AUG 26 */
              fun dtg(timeMillis: Long): String {
                  val sdf = SimpleDateFormat("ddHHmm'Z' MMM yy", Locale.US)
                  sdf.timeZone = TimeZone.getTimeZone("UTC")
                  return sdf.format(Date(timeMillis)).uppercase(Locale.US)
              }

              fun formatAltitude(meters: Double, units: Int): String = when (units) {
                  1 -> "${(meters * 3.28084).roundToLong()} ft"
                  else -> "${meters.roundToLong()} m"
              }

              fun formatAccuracy(meters: Float, units: Int): String = when (units) {
                  1 -> "±${(meters * 3.28084).roundToLong()} ft"
                  else -> "±${meters.roundToLong()} m"
              }

              fun formatSpeed(metersPerSecond: Float, units: Int): String = when (units) {
                  1 -> String.format(Locale.US, "%.1f mph", metersPerSecond * 2.23694)
                  2 -> String.format(Locale.US, "%.1f kn", metersPerSecond * 1.94384)
                  else -> String.format(Locale.US, "%.1f km/h", metersPerSecond * 3.6)
              }

              private fun utmZone(lat: Double, lon: Double): Int {
                  var zone = (floor((lon + 180.0) / 6.0) + 1.0).toInt().coerceIn(1, 60)
                  // Norway exception
                  if (lat in 56.0..64.0 && lon in 3.0..12.0) zone = 32
                  // Svalbard exceptions
                  if (lat in 72.0..84.0) {
                      zone = when {
                          lon in 0.0..9.0 -> 31
                          lon in 9.0..21.0 -> 33
                          lon in 21.0..33.0 -> 35
                          lon in 33.0..42.0 -> 37
                          else -> zone
                      }
                  }
                  return zone
              }

              /** Grid convergence angle (degrees): grid north minus true north for this UTM zone. */
              fun gridConvergence(lat: Double, lon: Double): Double {
                  val zone = utmZone(lat, lon)
                  val lonOrigin = ((zone - 1) * 6 - 180 + 3).toDouble()
                  return Math.toDegrees(
                      atan(tan(Math.toRadians(lon - lonOrigin)) * sin(Math.toRadians(lat)))
                  )
              }

              private fun gridConvergenceForZone(lat: Double, lon: Double, zone: Int): Double {
                  val lonOrigin = ((zone - 1) * 6 - 180 + 3).toDouble()
                  return Math.toDegrees(
                      atan(tan(Math.toRadians(lon - lonOrigin)) * sin(Math.toRadians(lat)))
                  )
              }

              /** Result of a two-ray fix: the intersection plus the range from each observer. */
              data class RayFix(val lat: Double, val lon: Double, val dist1: Double, val dist2: Double)

              /**
               * Intersection of two rays given in TRUE bearings, solved in the UTM plane of
               * the first point's zone (grid bearings via per-point convergence). Null when
               * the rays are near-parallel, diverge, or the fix lands beyond 100 km — the
               * cases a map-reading instructor would also reject.
               */
              fun rayIntersection(
                  lat1: Double, lon1: Double, bearing1True: Double,
                  lat2: Double, lon2: Double, bearing2True: Double,
              ): RayFix? {
                  val zone = utmZone(lat1, lon1)
                  val north = lat1 >= 0
                  val p1 = utmForZone(lat1, lon1, zone, north)
                  val p2 = utmForZone(lat2, lon2, zone, north)
                  val g1 = Math.toRadians(bearing1True - gridConvergenceForZone(lat1, lon1, zone))
                  val g2 = Math.toRadians(bearing2True - gridConvergenceForZone(lat2, lon2, zone))
                  val d1x = sin(g1)
                  val d1y = cos(g1)
                  val d2x = sin(g2)
                  val d2y = cos(g2)
                  val cross = d1x * d2y - d1y * d2x
                  if (abs(cross) < 1e-6) return null
                  val dx = p2[0] - p1[0]
                  val dy = p2[1] - p1[1]
                  val t = (dx * d2y - dy * d2x) / cross
                  val s = (dx * d1y - dy * d1x) / cross
                  if (t <= 0.0 || s <= 0.0 || t > 100_000.0 || s > 100_000.0) return null
                  val ll = utmInverse(p1[0] + t * d1x, p1[1] + t * d1y, zone, north)
                  return RayFix(ll[0], ll[1], t, s)
              }

              data class NavInfo(val distanceMeters: Float, val bearingTrue: Float)

              /**
               * Geodesic distance and initial true bearing between two points.
               *
               * Was `android.location.Location.distanceBetween`. That is Vincenty on
               * WGS84 and so is [Geodesy], to well under a millimetre — GoldenTest holds
               * both to the same vectors. The reason for the swap is that the framework
               * call is stubbed out in JVM unit tests, so every distance the app shows
               * was untestable in CI; and the iOS port needs the identical numbers.
               */
              fun navInfo(fromLat: Double, fromLon: Double, toLat: Double, toLon: Double): NavInfo {
                  val d = Geodesy.distanceAndBearing(fromLat, fromLon, toLat, toLon)
                  return NavInfo(d[0].toFloat(), (((d[1] % 360.0) + 360.0) % 360.0).toFloat())
              }

              fun formatDistance(meters: Float, units: Int): String = when (units) {
                  1 -> {
                      val feet = meters * 3.28084f
                      if (feet < 1000f) String.format(Locale.US, "%.0f ft", feet)
                      else String.format(Locale.US, "%.2f mi", meters / 1609.344f)
                  }
                  2 -> {
                      if (meters < 1852f) String.format(Locale.US, "%.0f m", meters)
                      else String.format(Locale.US, "%.2f NM", meters / 1852f)
                  }
                  else -> {
                      if (meters < 1000f) String.format(Locale.US, "%.0f m", meters)
                      else if (meters < 10000f) String.format(Locale.US, "%.2f km", meters / 1000f)
                      else String.format(Locale.US, "%.1f km", meters / 1000f)
                  }
              }

              /** Format an angle in degrees (0..360) as degrees or NATO mils per the angle-unit setting. */
              fun formatAngle(degrees: Float, angleUnit: Int): String = when (angleUnit) {
                  1 -> {
                      val mils = Math.round(degrees * 6400.0 / 360.0)
                      String.format(Locale.US, "%d mils", ((mils % 6400) + 6400) % 6400)
                  }
                  else -> {
                      val deg = Math.round(degrees.toDouble())
                      String.format(Locale.US, "%03d°", ((deg % 360) + 360) % 360)
                  }
              }

              /** Parse an MGRS string (spaces allowed, case-insensitive) to lat/lon. Null if invalid. */
              fun parseMgrs(text: String): Pair<Double, Double>? = runCatching {
                  val cleaned = asciiDigits(text.trim()).uppercase(Locale.US).replace(" ", "")
                  if (cleaned.isEmpty()) return null
                  val mgrs = MGRS.parse(cleaned)
                  // The library lands on the SW corner of the designated cell. Aim at the
                  // centre instead: a 6-digit grid means "somewhere in this 100 m square",
                  // and re-formatting a corner point can fall into the neighbouring cell.
                  val digits = cleaned.dropWhile { it.isDigit() }.drop(1).drop(2).count { it.isDigit() }
                  val cell = if (digits == 0) 100000.0 else 10.0.pow(5 - digits / 2)
                  val utm = mgrs.toUTM()
                  val north = utm.hemisphere.toString().uppercase(Locale.US).startsWith("N")
                  val ll = utmInverse(utm.easting + cell / 2.0, utm.northing + cell / 2.0, utm.zone, north)
                  ll[0] to ll[1]
              }.getOrNull()

              /**
               * Parse an MGRS string to the SW corner of its cell (no centre offset).
               * Roadmap A (photo-map calibration): control points are grid LINE
               * intersections = cell corners. Never use [parseMgrs] here — it aims at
               * the cell centre and would bake a half-cell error into the homography.
               */
              fun parseMgrsCorner(text: String): Pair<Double, Double>? = runCatching {
                  val cleaned = asciiDigits(text.trim()).uppercase(Locale.US).replace(" ", "")
                  if (cleaned.isEmpty()) return null
                  val mgrs = MGRS.parse(cleaned)
                  val utm = mgrs.toUTM()
                  val north = utm.hemisphere.toString().uppercase(Locale.US).startsWith("N")
                  val ll = utmInverse(utm.easting, utm.northing, utm.zone, north)
                  ll[0] to ll[1]
              }.getOrNull()

              /**
               * Scale a typed grid line number to 5 digits ("45" -> 45000).
               * Control-point entry takes 2-5 digits per roadmap A; null otherwise.
               * Pure — shared with iOS calibration screen verbatim.
               */
              fun scaleGridLineNumber(raw: String): Double? {
                  val digits = raw.filter { it.isDigit() }
                  if (digits.length !in 2..5 || digits.length != raw.trim().length) return null
                  return (digits + "0".repeat(5 - digits.length)).toDoubleOrNull()
              }

              // ---- Grid-overlay math: forced-zone UTM forward and the Snyder-series inverse ----
              // Validated by roundtrip against the forward formulas above: < 1 mm error worldwide,
              // < 7 mm out to 4.5 degrees from the central meridian (grid lines never go further).

              /** UTM easting/northing of a point projected in a SPECIFIC zone (for grid drawing). */
              fun utmForZone(lat: Double, lon: Double, zone: Int, north: Boolean): DoubleArray {
                  val latRad = Math.toRadians(lat)
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lonRad = Math.toRadians(lon)
                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)
                  val n = a / sqrt(1.0 - e2 * sin(latRad).pow(2))
                  val t = tan(latRad).pow(2)
                  val c = ep2 * cos(latRad).pow(2)
                  val bigA = cos(latRad) * (lonRad - lonOrigin)
                  val m = a * (
                      (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0) * latRad -
                          (3.0 * e2 / 8.0 + 3.0 * e2 * e2 / 32.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(2.0 * latRad) +
                          (15.0 * e2 * e2 / 256.0 + 45.0 * e2 * e2 * e2 / 1024.0) * sin(4.0 * latRad) -
                          (35.0 * e2 * e2 * e2 / 3072.0) * sin(6.0 * latRad)
                      )
                  val easting = k0 * n * (
                      bigA + (1.0 - t + c) * bigA.pow(3) / 6.0 +
                          (5.0 - 18.0 * t + t * t + 72.0 * c - 58.0 * ep2) * bigA.pow(5) / 120.0
                      ) + 500000.0
                  var northing = k0 * (
                      m + n * tan(latRad) * (
                          bigA.pow(2) / 2.0 +
                              (5.0 - t + 9.0 * c + 4.0 * c * c) * bigA.pow(4) / 24.0 +
                              (61.0 - 58.0 * t + t * t + 600.0 * c - 330.0 * ep2) * bigA.pow(6) / 720.0
                          )
                      )
                  if (!north) northing += 10000000.0
                  return doubleArrayOf(easting, northing)
              }

              /** UTM easting/northing back to lat/lon (WGS84). Returns [lat, lon]. */
              fun utmInverse(easting: Double, northing: Double, zone: Int, north: Boolean): DoubleArray {
                  val a = 6378137.0
                  val f = 1.0 / 298.257223563
                  val k0 = 0.9996
                  val e2 = f * (2.0 - f)
                  val ep2 = e2 / (1.0 - e2)
                  val x = easting - 500000.0
                  val y = if (north) northing else northing - 10000000.0
                  val m = y / k0
                  val mu = m / (a * (1.0 - e2 / 4.0 - 3.0 * e2 * e2 / 64.0 - 5.0 * e2 * e2 * e2 / 256.0))
                  val e1 = (1.0 - sqrt(1.0 - e2)) / (1.0 + sqrt(1.0 - e2))
                  val phi1 = mu +
                      (3.0 * e1 / 2.0 - 27.0 * e1 * e1 * e1 / 32.0) * sin(2.0 * mu) +
                      (21.0 * e1 * e1 / 16.0 - 55.0 * e1.pow(4) / 32.0) * sin(4.0 * mu) +
                      (151.0 * e1 * e1 * e1 / 96.0) * sin(6.0 * mu) +
                      (1097.0 * e1.pow(4) / 512.0) * sin(8.0 * mu)
                  val sin1 = sin(phi1)
                  val cos1 = cos(phi1)
                  val tan1 = tan(phi1)
                  val c1 = ep2 * cos1 * cos1
                  val t1 = tan1 * tan1
                  val n1 = a / sqrt(1.0 - e2 * sin1 * sin1)
                  val r1 = a * (1.0 - e2) / (1.0 - e2 * sin1 * sin1).pow(1.5)
                  val d = x / (n1 * k0)
                  val lat = phi1 - (n1 * tan1 / r1) * (
                      d * d / 2.0 -
                          (5.0 + 3.0 * t1 + 10.0 * c1 - 4.0 * c1 * c1 - 9.0 * ep2) * d.pow(4) / 24.0 +
                          (61.0 + 90.0 * t1 + 298.0 * c1 + 45.0 * t1 * t1 - 252.0 * ep2 - 3.0 * c1 * c1) * d.pow(6) / 720.0
                      )
                  val lonOrigin = Math.toRadians(((zone - 1) * 6 - 180 + 3).toDouble())
                  val lon = lonOrigin + (
                      d -
                          (1.0 + 2.0 * t1 + c1) * d.pow(3) / 6.0 +
                          (5.0 - 2.0 * c1 + 28.0 * t1 - 3.0 * c1 * c1 + 8.0 * ep2 + 24.0 * t1 * t1) * d.pow(5) / 120.0
                      ) / cos1
                  return doubleArrayOf(Math.toDegrees(lat), Math.toDegrees(lon))
              }

              /** MGRS latitude band letter for a latitude in -80..84, e.g. 'R' for Dubai. */
              fun bandLetter(lat: Double): Char {
                  val letters = "CDEFGHJKLMNPQRSTUVWX"
                  val idx = floor((lat + 80.0) / 8.0).toInt().coerceIn(0, 19)
                  return letters[idx]
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/coords'
          cat > 'app/src/main/java/app/gridfix/android/coords/Geodesy.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.coords

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.atan
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.math.tan

          /**
           * Distance and bearing on the WGS84 ellipsoid — Vincenty's inverse formula.
           *
           * This is the same algorithm `android.location.Location.distanceBetween` runs,
           * so replacing that call with this one moves no number the app displays: the
           * two agree to well under a millimetre, which [GoldenTest] proves against
           * vectors that also ship to the iOS port.
           *
           * Two reasons it is written out here rather than called from the framework:
           *
           *  - `Location.distanceBetween` is stubbed to a no-op in JVM unit tests, so
           *    every distance the app computes — course scoring, the arrival alert,
           *    route-card legs, pace counts, strip maps — was untestable in CI.
           *  - iOS needs the identical numbers. Two phones in one patrol reporting
           *    different ranges to the same point is the failure this prevents.
           *
           * A great-circle shortcut would be 0.3 to 0.5 % off — centimetres at the 25 m
           * course ring, but tens of metres on a long leg — so it is used only as the
           * fallback for the near-antipodal case that never converges, and which land
           * navigation never reaches.
           *
           * Pure Kotlin, no Android imports: this file moves to `:core` verbatim.
           */
          object Geodesy {

              private const val A = 6378137.0
              private const val F = 1.0 / 298.257223563
              private const val B = A * (1.0 - F)
              private const val MEAN_RADIUS = 6371008.8

              /**
               * Geodesic distance in metres and initial bearing in degrees from true
               * north, returned as [distance, bearing]. The bearing is NOT normalised —
               * [Coordinates.navInfo] wraps it into 0..<360 on the way to the readout.
               */
              fun distanceAndBearing(
                  fromLat: Double, fromLon: Double, toLat: Double, toLon: Double,
              ): DoubleArray {
                  if (fromLat == toLat && fromLon == toLon) return doubleArrayOf(0.0, 0.0)

                  val l = (toLon - fromLon) * PI / 180.0
                  val u1 = atan((1.0 - F) * tan(fromLat * PI / 180.0))
                  val u2 = atan((1.0 - F) * tan(toLat * PI / 180.0))
                  val sinU1 = sin(u1); val cosU1 = cos(u1)
                  val sinU2 = sin(u2); val cosU2 = cos(u2)

                  var lambda = l
                  var sinSigma = 0.0
                  var cosSigma = 0.0
                  var sigma = 0.0
                  var cosSqAlpha = 0.0
                  var cos2SigmaM = 0.0
                  var converged = false

                  for (iteration in 0 until 200) {
                      val sinLambda = sin(lambda)
                      val cosLambda = cos(lambda)
                      val p = cosU2 * sinLambda
                      val q = cosU1 * sinU2 - sinU1 * cosU2 * cosLambda
                      sinSigma = sqrt(p * p + q * q)
                      if (sinSigma == 0.0) return doubleArrayOf(0.0, 0.0)
                      cosSigma = sinU1 * sinU2 + cosU1 * cosU2 * cosLambda
                      sigma = atan2(sinSigma, cosSigma)
                      val sinAlpha = cosU1 * cosU2 * sinLambda / sinSigma
                      cosSqAlpha = 1.0 - sinAlpha * sinAlpha
                      cos2SigmaM =
                          if (cosSqAlpha == 0.0) 0.0 else cosSigma - 2.0 * sinU1 * sinU2 / cosSqAlpha
                      val c = F / 16.0 * cosSqAlpha * (4.0 + F * (4.0 - 3.0 * cosSqAlpha))
                      val previous = lambda
                      lambda = l + (1.0 - c) * F * sinAlpha *
                          (sigma + c * sinSigma *
                              (cos2SigmaM + c * cosSigma * (-1.0 + 2.0 * cos2SigmaM * cos2SigmaM)))
                      if (abs(lambda - previous) < 1e-12) {
                          converged = true
                          break
                      }
                  }

                  if (!converged) {
                      return doubleArrayOf(
                          greatCircleMeters(fromLat, fromLon, toLat, toLon),
                          greatCircleBearing(fromLat, fromLon, toLat, toLon),
                      )
                  }

                  val uSq = cosSqAlpha * (A * A - B * B) / (B * B)
                  val bigA = 1.0 + uSq / 16384.0 * (4096.0 + uSq * (-768.0 + uSq * (320.0 - 175.0 * uSq)))
                  val bigB = uSq / 1024.0 * (256.0 + uSq * (-128.0 + uSq * (74.0 - 47.0 * uSq)))
                  val deltaSigma = bigB * sinSigma * (
                      cos2SigmaM + bigB / 4.0 * (
                          cosSigma * (-1.0 + 2.0 * cos2SigmaM * cos2SigmaM) -
                              bigB / 6.0 * cos2SigmaM * (-3.0 + 4.0 * sinSigma * sinSigma) *
                              (-3.0 + 4.0 * cos2SigmaM * cos2SigmaM)
                          )
                      )
                  val s = B * bigA * (sigma - deltaSigma)

                  val sinLambda = sin(lambda)
                  val cosLambda = cos(lambda)
                  val alpha1 = atan2(cosU2 * sinLambda, cosU1 * sinU2 - sinU1 * cosU2 * cosLambda)
                  return doubleArrayOf(s, alpha1 * 180.0 / PI)
              }

              /**
               * Great-circle distance on a sphere of the WGS84 mean radius. Half a percent
               * off the ellipsoid, so it is only for the non-convergent fallback and for
               * cheap proximity sorting where that does not matter.
               */
              fun greatCircleMeters(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val p1 = lat1 * PI / 180.0
                  val p2 = lat2 * PI / 180.0
                  val dp = p2 - p1
                  val dl = (lon2 - lon1) * PI / 180.0
                  val h = sin(dp / 2) * sin(dp / 2) + cos(p1) * cos(p2) * sin(dl / 2) * sin(dl / 2)
                  return 2.0 * MEAN_RADIUS * atan2(sqrt(h), sqrt((1.0 - h).coerceAtLeast(0.0)))
              }

              fun greatCircleBearing(lat1: Double, lon1: Double, lat2: Double, lon2: Double): Double {
                  val p1 = lat1 * PI / 180.0
                  val p2 = lat2 * PI / 180.0
                  val dl = (lon2 - lon1) * PI / 180.0
                  val y = sin(dl) * cos(p2)
                  val x = cos(p1) * sin(p2) - sin(p1) * cos(p2) * cos(dl)
                  return (atan2(y, x) * 180.0 / PI + 360.0) % 360.0
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/data'
          cat > 'app/src/main/java/app/gridfix/android/data/TrackRepository.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.data

          import android.content.Context
          import androidx.datastore.core.handlers.ReplaceFileCorruptionHandler
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import app.gridfix.android.coords.Geodesy
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.first
          import kotlinx.coroutines.flow.map
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.TimeZone
          import java.util.UUID

          private val Context.trackStore by preferencesDataStore(
              name = "tracks",
              corruptionHandler = ReplaceFileCorruptionHandler { emptyPreferences() },
          )

          /** Track metadata; the point log lives in files/tracks/<id>.txt (one point per line). */
          data class TrackInfo(
              val id: String,
              val name: String,
              val startedAt: Long,
              val endedAt: Long,        // 0 while recording
              val distanceM: Double,
              val pointCount: Int,
              val folder: String = DEFAULT_FOLDER,   // overlay folder, shares the eye switch with waypoints and graphics
          )

          /**
           * A logged fix. [alt] is metres above mean sea level, or [NO_ALTITUDE] when the
           * receiver gave no height: writing a real number there would put the leg at sea
           * level on every profile that reads it.
           */
          data class TrackPoint(val lat: Double, val lon: Double, val time: Long, val alt: Double)

          /** "this fix had no altitude" — omitted from GPX rather than written as a height. */
          const val NO_ALTITUDE = -32768.0

          fun Double.hasAltitude(): Boolean = this > NO_ALTITUDE + 1.0

          class TrackRepository(private val context: Context) {

              private val listKey = stringPreferencesKey("list")

              val tracks: Flow<List<TrackInfo>> = context.trackStore.data.map { p ->
                  decode(p[listKey] ?: "[]").sortedByDescending { it.startedAt }
              }

              suspend fun startTrack(nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  val info = TrackInfo(
                      id = id,
                      name = "Track " + dtgShort(nowMillis),
                      startedAt = nowMillis,
                      endedAt = 0L,
                      distanceM = 0.0,
                      pointCount = 0,
                  )
                  withContext(Dispatchers.IO) { pointsFile(context, id).parentFile?.mkdirs() }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Close out a finished recording: compute stats from the point log. */
              suspend fun finishTrack(id: String, name: String?, nowMillis: Long) {
                  val pts = readPoints(context, id)
                  var dist = 0.0
                  for (i in 1 until pts.size) {
                      dist += Geodesy.distanceAndBearing(
                          pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon
                      )[0]
                  }
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(
                                  name = name?.trim()?.ifBlank { it.name } ?: it.name,
                                  endedAt = nowMillis,
                                  distanceM = dist,
                                  pointCount = pts.size,
                              ) else it
                          }
                      )
                  }
              }

              /** Create a finished track from imported points (GPX trk import). */
              suspend fun importTrack(name: String, points: List<TrackPoint>, nowMillis: Long): String {
                  val id = UUID.randomUUID().toString()
                  withContext(Dispatchers.IO) {
                      val f = pointsFile(context, id)
                      f.parentFile?.mkdirs()
                      f.bufferedWriter().use { out ->
                          for (p in points) {
                              out.write(
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", p.lat, p.lon, p.time, p.alt)
                              )
                          }
                      }
                  }
                  var dist = 0.0
                  for (i in 1 until points.size) {
                      dist += Geodesy.distanceAndBearing(
                          points[i - 1].lat, points[i - 1].lon, points[i].lat, points[i].lon
                      )[0]
                  }
                  val start = points.firstOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val end = points.lastOrNull()?.time?.takeIf { it > 0 } ?: nowMillis
                  val info = TrackInfo(
                      id = id,
                      name = name.trim().ifBlank { "Imported track" },
                      startedAt = start,
                      endedAt = end,
                      distanceM = dist,
                      pointCount = points.size,
                  )
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]") + info)
                  }
                  return id
              }

              /** Restore one track from a backup, keeping its id; skipped when already present. */
              suspend fun restore(info: TrackInfo, points: List<TrackPoint>): Boolean {
                  var added = false
                  context.trackStore.edit { p ->
                      val current = decode(p[listKey] ?: "[]")
                      if (current.none { it.id == info.id }) {
                          val f = pointsFile(context, info.id)
                          f.parentFile?.mkdirs()
                          f.writeText(
                              points.joinToString("") {
                                  String.format(Locale.US, "%.7f %.7f %d %.1f\n", it.lat, it.lon, it.time, it.alt)
                              }
                          )
                          p[listKey] = encode(current + info)
                          added = true
                      }
                  }
                  return added
              }

              suspend fun rename(id: String, name: String) {
                  if (name.isBlank()) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(name = name.trim()) else it
                          }
                      )
                  }
              }

              suspend fun setFolder(id: String, folder: String) {
                  val clean = canonicalFolder(folder)
                  context.trackStore.edit { p ->
                      p[listKey] = encode(
                          decode(p[listKey] ?: "[]").map {
                              if (it.id == id) it.copy(folder = clean) else it
                          }
                      )
                  }
              }

              suspend fun delete(id: String) {
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").filterNot { it.id == id })
                  }
                  withContext(Dispatchers.IO) { pointsFile(context, id).delete() }
              }

              /** Move every track in [from] to [to] (folder rename, or emptying a folder into Base). */
              suspend fun renameFolder(from: String, to: String) {
                  val target = canonicalFolder(to)
                  if (from == target) return
                  context.trackStore.edit { p ->
                      p[listKey] = encode(decode(p[listKey] ?: "[]").map { if (it.folder == from) it.copy(folder = target) else it })
                  }
              }

              /** Delete every track in [folder], point logs included. */
              suspend fun deleteFolder(folder: String) {
                  val doomed = decode(context.trackStore.data.first()[listKey] ?: "[]").filter { it.folder == folder }
                  for (t in doomed) delete(t.id)
              }

              /** Remove a recording that was discarded before saving. */
              suspend fun discard(id: String) = delete(id)

              /**
               * Heal recordings the OS killed mid-way: any track still open (endedAt == 0)
               * that is not the one currently recording is closed out from its point log
               * (the points are on disk — only the summary was lost), or removed when it
               * never logged a point.
               */
              suspend fun finalizeOrphans(activeId: String?) {
                  val open = decode(context.trackStore.data.first()[listKey] ?: "[]")
                      .filter { it.endedAt == 0L && it.id != activeId }
                  for (t in open) {
                      val pts = readPoints(context, t.id)
                      if (pts.isEmpty()) {
                          delete(t.id)
                      } else {
                          val last = pts.last().time
                          finishTrack(t.id, null, if (last > t.startedAt) last else System.currentTimeMillis())
                      }
                  }
              }

              // One damaged record must not take the whole list with it: skip it, keep the rest.
              private fun decode(json: String): List<TrackInfo> {
                  val arr = runCatching { JSONArray(json) }.getOrNull() ?: return emptyList()
                  return buildList {
                      for (i in 0 until arr.length()) {
                          runCatching {
                              val o = arr.getJSONObject(i)
                              TrackInfo(
                                  id = o.getString("id"),
                                  name = o.getString("name"),
                                  startedAt = o.optLong("startedAt"),
                                  endedAt = o.optLong("endedAt"),
                                  distanceM = o.optDouble("distanceM", 0.0),
                                  pointCount = o.optInt("pointCount", 0),
                                  folder = canonicalFolder(o.optString("folder", DEFAULT_FOLDER)),
                              )
                          }.getOrNull()?.let { add(it) }
                      }
                  }
              }

              private fun encode(list: List<TrackInfo>): String {
                  val arr = JSONArray()
                  for (t in list) {
                      arr.put(
                          JSONObject()
                              .put("id", t.id)
                              .put("name", t.name)
                              .put("startedAt", t.startedAt)
                              .put("endedAt", t.endedAt)
                              .put("distanceM", t.distanceM)
                              .put("pointCount", t.pointCount)
                              .put("folder", t.folder)
                      )
                  }
                  return arr.toString()
              }

              companion object {
                  fun pointsFile(context: Context, id: String): File =
                      File(File(context.filesDir, "tracks"), "$id.txt")

                  /** Append one point; called from the recorder service's worker thread. */
                  fun appendPoint(context: Context, id: String, lat: Double, lon: Double, time: Long, alt: Double) {
                      runCatching {
                          val f = pointsFile(context, id)
                          f.parentFile?.mkdirs()
                          f.appendText(
                              String.format(Locale.US, "%.7f %.7f %d %.1f\n", lat, lon, time, alt)
                          )
                      }
                  }

                  suspend fun readPoints(context: Context, id: String): List<TrackPoint> =
                      withContext(Dispatchers.IO) {
                          val f = pointsFile(context, id)
                          if (!f.exists()) return@withContext emptyList()
                          f.readLines().mapNotNull { line ->
                              val parts = line.trim().split(" ")
                              if (parts.size < 3) return@mapNotNull null
                              runCatching {
                                  TrackPoint(
                                      lat = parts[0].toDouble(),
                                      lon = parts[1].toDouble(),
                                      time = parts[2].toLong(),
                                      alt = parts.getOrNull(3)?.toDouble() ?: NO_ALTITUDE,
                                  )
                              }.getOrNull()
                          }
                      }

                  /** Minimal GPX 1.1 document for one track. */
                  fun buildGpx(name: String, points: List<TrackPoint>): String {
                      val sdf = SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      val sb = StringBuilder()
                      sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                      sb.append("<gpx version=\"1.1\" creator=\"MGRS GPS\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                      sb.append("  <trk>\n    <name>").append(escapeXml(name)).append("</name>\n    <trkseg>\n")
                      for (p in points) {
                          val ele = if (p.alt.hasAltitude()) String.format(Locale.US, "<ele>%.1f</ele>", p.alt) else ""
                          sb.append(
                              String.format(
                                  Locale.US,
                                  "      <trkpt lat=\"%.7f\" lon=\"%.7f\">%s<time>%s</time></trkpt>\n",
                                  p.lat, p.lon, ele, sdf.format(Date(p.time)),
                              )
                          )
                      }
                      sb.append("    </trkseg>\n  </trk>\n</gpx>\n")
                      return sb.toString()
                  }

                  private fun escapeXml(s: String): String = s
                      .replace("&", "&amp;")
                      .replace("<", "&lt;")
                      .replace(">", "&gt;")
                      .replace("\"", "&quot;")

                  private fun dtgShort(timeMillis: Long): String {
                      val sdf = SimpleDateFormat("ddHHmm'Z'", Locale.US)
                      sdf.timeZone = TimeZone.getTimeZone("UTC")
                      return sdf.format(Date(timeMillis))
                  }
              }
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/main/java/app/gridfix/android/map'
          cat > 'app/src/main/java/app/gridfix/android/map/ElevationStore.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android.map

          import java.io.File

          /**
           * Elevation storage seam — pure JVM, no Context, no Bitmap.
           *
           * [Elevation] currently hard-codes `File(context.filesDir, "dem")` with an
           * in-memory cap of 12 bitmaps and no on-disk cap (P1: prefetch 400 tiles x
           * N boxes fills the device; osmdroid trims at 500 MB, dem does not).
           *
           * This file adds the portable policy next to it without changing behavior:
           * osmdroid keeps calling `Elevation` untouched. The MapLibre adapter and the
           * iOS port implement [ElevationStore] with their own sandbox dir and call
           * [trimOldest] after prefetch.
           *
           * KMP-ready: move verbatim to `:core` when it becomes `commonMain`.
           */
          interface ElevationStore {
              val dir: File

              fun fileFor(z: Int, x: Int, y: Int): File =
                  File(dir, "${z}_${x}_$y.png")
          }

          /** Delete oldest PNGs beyond [maxFiles]. Returns files removed. */
          fun ElevationStore.trimOldest(maxFiles: Int = 400): Int {
              val pngs = dir.listFiles { f -> f.isFile && f.name.endsWith(".png") }
                  ?.sortedBy { it.lastModified() } ?: return 0
              if (pngs.size <= maxFiles) return 0
              var removed = 0
              for (f in pngs.take(pngs.size - maxFiles)) {
                  if (runCatching { f.delete() }.getOrDefault(false)) removed++
              }
              return removed
          }

          /** Default on-disk cap shared by Android + iOS until tuned on device. */
          const val ELEVATION_MAX_CACHED_TILES = 400
