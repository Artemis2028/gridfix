name: Build GridFix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Write source files (v0.9.17 (test fix, release gating) delta, plain text, auditable below)
        run: |
          if [ "$(cat .github/last-payload 2>/dev/null)" = "v0.9.17-86b91226cf8c" ]; then
            echo "payload v0.9.17-86b91226cf8c already applied - skipping (edit the files in git, not here)"
          else
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOF_GRIDFIX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "app.gridfix.android"
              compileSdk = 36

              defaultConfig {
                  applicationId = "app.gridfix.android"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 45
                  versionName = "0.9.17"
                  // MapTiler API key from the CI secret; empty in builds without it (community-tile fallback)
                  buildConfigField("String", "MAPTILER_KEY", "\"" + (System.getenv("MAPTILER_KEY") ?: "") + "\"")
              }

              // Play upload key: CI decodes the keystore secret to a file and exports
              // GRIDFIX_KS + GRIDFIX_KS_PASS. Without them, release stays unsigned and
              // only the debug APK is built.
              val ksPath = System.getenv("GRIDFIX_KS")
              val ksPass = System.getenv("GRIDFIX_KS_PASS")
              signingConfigs {
                  if (ksPath != null && ksPass != null) {
                      create("release") {
                          storeFile = file(ksPath)
                          storePassword = ksPass
                          keyAlias = "gridfix"
                          keyPassword = ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      // R8: shrink + obfuscate. The CI keeps mapping.txt with every build so a
                      // Play crash report can be de-obfuscated, and also builds a signed release
                      // APK so this exact output can be installed and smoke-tested before upload.
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.findByName("release")
                  }
              }

              testOptions {
                  unitTests.isReturnDefaultValues = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              // NGA (National Geospatial-Intelligence Agency) MGRS library, MIT licensed
              implementation("mil.nga:mgrs:2.1.3")

              // Map engine: osmdroid (Apache 2.0) — offline-first raster maps, MBTiles, tile cache
              implementation("org.osmdroid:osmdroid-android:6.1.20")

              // QR generation for position hand-off (Apache 2.0)
              implementation("com.google.zxing:core:3.5.3")

              // Google Play Billing for the GridFix Pro subscription
              implementation("com.android.billingclient:billing-ktx:9.1.0")

              // Transitive androidx.fragment 1.1.0 is flagged outdated by Play; pin a current one
              implementation("androidx.fragment:fragment:1.8.5")

              // Field math (MGRS, UTM, zone exceptions, ray fixes, sun/moon) is plain JVM code
              // and is the part that must never silently drift. See app/src/test.
              testImplementation("junit:junit:4.13.2")
          }
          EOF_GRIDFIX
          mkdir -p 'app/src/test/java/app/gridfix/android'
          cat > 'app/src/test/java/app/gridfix/android/CoordinatesTest.kt' <<'EOF_GRIDFIX'
          package app.gridfix.android

          import app.gridfix.android.coords.Coordinates
          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNotNull
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          /**
           * The field math is the part of this app that must never drift quietly: a wrong
           * grid looks exactly like a right one. These run on the JVM in CI on every build.
           */
          class CoordinatesTest {

              // ---- MGRS round trip -------------------------------------------------

              @Test
              fun `mgrs round trips at every precision`() {
                  val places = listOf(
                      24.4539 to 54.3773,      // Abu Dhabi
                      36.1699 to -115.1398,    // Las Vegas
                      -33.8688 to 151.2093,    // Sydney, southern hemisphere
                      51.5074 to -0.1278,      // London, straddling the prime meridian
                      -1.2921 to 36.8219,      // Nairobi, near the equator
                  )
                  for ((lat, lon) in places) {
                      for (digits in listOf(4, 6, 8, 10)) {
                          val first = Coordinates.mgrs(lat, lon, digits)
                          assertNotNull("no MGRS for $lat,$lon at $digits", first)
                          val parsed = Coordinates.parseMgrs(first!!.full)
                          assertNotNull("could not parse ${first.full}", parsed)
                          val again = Coordinates.mgrs(parsed!!.first, parsed.second, digits)
                          assertEquals(
                              "round trip changed the grid at $digits digits",
                              first.full,
                              again?.full,
                          )
                      }
                  }
              }

              @Test
              fun `single digit zones keep their leading zero handling`() {
                  // Zone 1, western Aleutians: the GZD is "1" not "01", and must survive a round trip.
                  val g = Coordinates.mgrs(52.0, -177.0, 8)
                  assertNotNull(g)
                  assertTrue("unexpected GZD ${g!!.gzd}", g.gzd.startsWith("1"))
                  val parsed = Coordinates.parseMgrs(g.full)
                  assertNotNull(parsed)
                  assertEquals(g.full, Coordinates.mgrs(parsed!!.first, parsed.second, 8)?.full)
              }

              // ---- Zone exceptions -------------------------------------------------

              @Test
              fun `norway 32V exception`() {
                  // South-west Norway: zone 32 is widened, so 59N 6E is 32V, not 31V.
                  assertEquals("32V", Coordinates.mgrs(59.0, 6.0, 8)?.gzd)
              }

              @Test
              fun `svalbard zone exceptions`() {
                  assertEquals("31X", Coordinates.mgrs(78.0, 5.0, 8)?.gzd)
                  assertEquals("33X", Coordinates.mgrs(78.0, 15.0, 8)?.gzd)
                  assertEquals("35X", Coordinates.mgrs(78.0, 25.0, 8)?.gzd)
                  assertEquals("37X", Coordinates.mgrs(78.0, 35.0, 8)?.gzd)
              }

              // ---- Cell centre, not the SW corner ----------------------------------

              @Test
              fun `parse lands on the cell centre`() {
                  // A 4-digit grid is a 1 km square. Parsing must aim at the middle of it:
                  // if someone "fixes" this back to the SW corner, re-formatting can fall
                  // into the neighbouring cell, and this test is why it must not happen.
                  //
                  // Asserted with tolerance rather than an exact "500": the point makes a
                  // round trip through our Snyder inverse and then NGA's own forward
                  // projection, and the two agree to about a metre, not to the millimetre.
                  // A corner would read 000 and a centre reads 499-501, so a metre of slack
                  // costs nothing and keeps the test from failing for the wrong reason.
                  val parsed = Coordinates.parseMgrs("33UXP0000")
                  assertNotNull(parsed)
                  val fine = Coordinates.mgrs(parsed!!.first, parsed.second, 10)
                  assertNotNull(fine)
                  val eastingInCell = fine!!.easting.takeLast(3).toInt()
                  val northingInCell = fine.northing.takeLast(3).toInt()
                  assertTrue(
                      "easting ${fine.easting} is not a cell centre (got $eastingInCell m into the cell)",
                      eastingInCell in 400..600,
                  )
                  assertTrue(
                      "northing ${fine.northing} is not a cell centre (got $northingInCell m into the cell)",
                      northingInCell in 400..600,
                  )
              }

              @Test
              fun `parse accepts spaces and lower case`() {
                  val a = Coordinates.parseMgrs("33U XP 0000 0000")
                  val b = Coordinates.parseMgrs("33uxp00000000")
                  assertNotNull(a)
                  assertNotNull(b)
                  assertEquals(a!!.first, b!!.first, 1e-9)
                  assertEquals(a.second, b.second, 1e-9)
              }

              @Test
              fun `rubbish does not parse`() {
                  assertNull(Coordinates.parseMgrs("not a grid"))
                  assertNull(Coordinates.parseMgrs(""))
              }

              // ---- Angle formatting wrap -------------------------------------------

              @Test
              fun `angles wrap instead of showing 360`() {
                  assertEquals("000°", Coordinates.formatAngle(359.5f, 0))
                  assertEquals("000°", Coordinates.formatAngle(360f, 0))
                  assertEquals("359°", Coordinates.formatAngle(359.4f, 0))
                  assertEquals("045°", Coordinates.formatAngle(45f, 0))
                  assertEquals("0 mils", Coordinates.formatAngle(360f, 1))
                  assertEquals("800 mils", Coordinates.formatAngle(45f, 1))
              }

              @Test
              fun `negative angles normalise`() {
                  assertEquals("270°", Coordinates.formatAngle(-90f, 0))
                  assertEquals("4800 mils", Coordinates.formatAngle(-90f, 1))
              }

              // ---- Ray intersection ------------------------------------------------

              @Test
              fun `converging rays give a fix ahead of both observers`() {
                  val fix = Coordinates.rayIntersection(36.0, 45.0, 45.0, 36.0, 45.01, 315.0)
                  assertNotNull("converging rays should intersect", fix)
                  assertTrue("fix should be north of both observers", fix!!.lat > 36.0)
                  assertTrue(fix.dist1 > 0.0 && fix.dist2 > 0.0)
              }

              @Test
              fun `parallel rays give no fix`() {
                  assertNull(Coordinates.rayIntersection(36.0, 45.0, 90.0, 36.01, 45.0, 90.0))
              }

              @Test
              fun `a crossing behind the observers gives no fix`() {
                  // Both rays point away from each other: they only "cross" behind.
                  assertNull(Coordinates.rayIntersection(36.0, 45.0, 225.0, 36.0, 45.01, 135.0))
              }

              @Test
              fun `a crossing beyond 100 km gives no fix`() {
                  // Almost parallel: the crossing is far outside any believable compass shot.
                  assertNull(Coordinates.rayIntersection(36.0, 45.0, 1.0, 36.0, 45.01, 0.5))
              }

              // ---- Grid convergence -------------------------------------------------

              @Test
              fun `convergence is zero on the central meridian and grows towards the edge`() {
                  // Zone 38 runs 42E-48E, central meridian 45E.
                  assertEquals(0.0, Coordinates.gridConvergence(36.0, 45.0), 1e-6)
                  val east = Coordinates.gridConvergence(36.0, 47.5)
                  val west = Coordinates.gridConvergence(36.0, 42.5)
                  assertTrue("east of the CM should be positive, was $east", east > 0.5)
                  assertTrue("west of the CM should be negative, was $west", west < -0.5)
              }
          }
          EOF_GRIDFIX
          echo "v0.9.17-86b91226cf8c" > .github/last-payload
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Sync v0.9.17 (test fix, release gating) source from bootstrap workflow'
            git push origin HEAD:main
          fi
          fi

      - name: Fetch bundled fonts (OFL; committed to main the first time)
        run: |
          mkdir -p app/src/main/res/font
          fetch_font() {  # dest-name  google/fonts path  css2 family spec (fallback)
            local dest="app/src/main/res/font/$1"
            if [ -s "$dest" ]; then echo "have $1"; return 0; fi
            curl -fsSL --retry 3 -o "$dest" "https://raw.githubusercontent.com/google/fonts/main/ofl/$2" || rm -f "$dest"
            if [ ! -s "$dest" ] && [ -n "$3" ]; then
              url=$(curl -fsSL -A 'curl/8' "https://fonts.googleapis.com/css2?family=$3" | grep -o 'https://fonts.gstatic.com[^)]*\.ttf' | head -1)
              if [ -n "$url" ]; then curl -fsSL --retry 3 -o "$dest" "$url" || rm -f "$dest"; fi
            fi
            if [ ! -s "$dest" ]; then echo "ERROR: could not fetch font $1"; exit 1; fi
            case "$(head -c 4 "$dest" | od -An -tx1 | tr -d ' \n')" in
              00010000|74727565|4f54544f) ;;
              *) echo "ERROR: $1 is not a TrueType/OpenType file:"; head -c 300 "$dest"; echo; exit 1 ;;
            esac
            echo "fetched $1 ($(wc -c < "$dest") bytes)"
          }
          fetch_font antonio.ttf 'antonio/Antonio%5Bwght%5D.ttf' 'Antonio:wght@700'
          fetch_font saira_semi_condensed_regular.ttf 'sairasemicondensed/SairaSemiCondensed-Regular.ttf' 'Saira+Semi+Condensed'
          fetch_font saira_semi_condensed_medium.ttf 'sairasemicondensed/SairaSemiCondensed-Medium.ttf' 'Saira+Semi+Condensed:wght@500'
          fetch_font saira_semi_condensed_semibold.ttf 'sairasemicondensed/SairaSemiCondensed-SemiBold.ttf' 'Saira+Semi+Condensed:wght@600'
          fetch_font saira_semi_condensed_bold.ttf 'sairasemicondensed/SairaSemiCondensed-Bold.ttf' 'Saira+Semi+Condensed:wght@700'
          fetch_font fira_mono_regular.ttf 'firamono/FiraMono-Regular.ttf' 'Fira+Mono'
          fetch_font fira_mono_medium.ttf 'firamono/FiraMono-Medium.ttf' 'Fira+Mono:wght@500'
          fetch_font fira_mono_bold.ttf 'firamono/FiraMono-Bold.ttf' 'Fira+Mono:wght@700'
          # No commit here: the wrapper step makes one commit for everything the
          # bootstrap touched, so a concurrent push to main can only lose one race.
          echo "fonts step done"

      - name: Materialize symbol tree from icon pack (only when symbols are missing)
        run: |
          HAVE=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$HAVE" -ge 112 ]; then
            echo "$HAVE NATO symbols already committed - nothing to materialize"
            exit 0
          fi
          if [ ! -f 'Nato Icons.zip' ]; then
            echo 'ERROR: symbols are missing and Nato Icons.zip is not in the repo root.'
            echo 'Upload it once on GitHub: Add file -> Upload files -> drop the zip -> Commit.'
            exit 1
          fi
          python3 - <<'PYEOF'
          import sys, zipfile, pathlib
          dirs = {"f": ("Friend Land", "1"), "h": ("Hostile Land", "3"),
                  "n": ("Neutral Land", "2"), "u": ("Unknown Land", "0")}
          out = pathlib.Path("app/src/main/res/drawable-nodpi")
          z = zipfile.ZipFile("Nato Icons.zip")
          names = set(z.namelist())
          rows = []
          for line in open("app/symbol-manifest.tsv"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              key, dim, func = line.split("\t")
              rows.append((key, dim, func))
          missing = []
          count = 0
          for key, dim, func in rows:
              for aff, (d, p) in dirs.items():
                  entry = d + "/" + p + "." + ("s" + aff + dim + "p" + func).ljust(15, "-") + ".png"
                  if entry not in names:
                      missing.append(entry)
                      continue
                  (out / ("nato_" + aff + "_" + key + ".png")).write_bytes(z.read(entry))
                  count += 1
          if missing:
              print("MISSING ICONS:", missing)
              sys.exit(1)
          print("materialized", count, "symbol PNGs from the icon pack")
          PYEOF

      - name: Guard NATO symbol assets
        run: |
          COUNT=$(ls app/src/main/res/drawable-nodpi 2>/dev/null | grep -c '^nato_' || true)
          if [ "$COUNT" -lt 112 ]; then
            echo "ERROR: expected 112 curated NATO symbol PNGs in the repo, found $COUNT."
            echo "52 committed by the v0.2.2 bootstrap + 60 by the v0.7.8 doctrine pack; do not delete them."
            exit 1
          fi
          echo "$COUNT NATO symbols present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Commit the Gradle wrapper (once, so a clone builds without a Gradle install)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
            chmod +x gradlew
          fi
          # One commit for anything the bootstrap generated this run (fonts, wrapper).
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name='GridFix CI' -c user.email='ci@gridfix.local' commit -qm 'Bootstrap assets: Gradle wrapper and bundled fonts'
            git push origin HEAD:main
          fi
          ls -l gradlew

      - name: Unit tests (field math)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log | tail -n 60

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build signed release AAB for Play (needs keystore secrets)
        id: aab
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_B64 secret set - skipping release AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          set -o pipefail
          ./gradlew bundleRelease --no-daemon 2>&1 | tail -n 80
          cp app/build/outputs/bundle/release/app-release.aab gridfix-release.aab
          echo "signed release AAB ready: gridfix-release.aab"

      - name: Build signed release APK (the same R8 output as the AAB, installable for a smoke test)
        if: steps.gradle.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          GRIDFIX_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No keystore secret - skipping release APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/gridfix-upload.p12
          export GRIDFIX_KS=/tmp/gridfix-upload.p12
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -n 40
          cp app/build/outputs/apk/release/app-release.apk gridfix-release.apk
          MAP=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAP" ]; then cp "$MAP" gridfix-mapping.txt; fi
          echo "release APK ready (minified) - install this to smoke-test what Play will ship"

      - name: Publish build status branch
        if: always()
        env:
          OUTCOME: ${{ steps.gradle.outcome }}
        run: |
          mkdir -p /tmp/ci-status
          cd /tmp/ci-status
          git init -q -b ci-status
          COMBINED=failure
          if [ "$OUTCOME" = "success" ] && [ "${{ steps.tests.outcome }}" = "success" ]; then
            COMBINED=success
          fi
          {
            echo "outcome=$COMBINED"
            echo "build=$OUTCOME"
            echo "run=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > outcome.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > buildlog.txt 2>/dev/null || echo "no log" > buildlog.txt
          tail -n 200 "$GITHUB_WORKSPACE/test.log" > testlog.txt 2>/dev/null || echo "no test log" > testlog.txt
          if [ "$OUTCOME" = "success" ]; then
            cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" gridfix-debug.apk
          fi
          git add -A
          git -c user.email='ci@gridfix.local' -c user.name='GridFix CI' commit -qm "build ${{ github.run_number }}: $OUTCOME"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status

      - name: Upload APK artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gridfix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish latest release for phone install
        if: steps.gradle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gridfix-debug.apk
          EXTRA=""
          if [ -f gridfix-release.aab ]; then EXTRA="gridfix-release.aab"; fi
          if [ -f gridfix-release.apk ]; then EXTRA="$EXTRA gridfix-release.apk"; fi
          if [ -f gridfix-mapping.txt ]; then EXTRA="$EXTRA gridfix-mapping.txt"; fi
          gh release delete latest --yes || true
          git push --delete origin refs/tags/latest || true
          gh release create latest gridfix-debug.apk $EXTRA \
            --title "MGRS GPS build ${{ github.run_number }}" \
            --notes 'Phone install: tap gridfix-debug.apk below, allow the install, open MGRS GPS. gridfix-release.aab (when present) is the signed bundle to upload to Play Console - do not install it on a phone.'
          # Keep a permanent copy of every build under its version, for rollback
          VN=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          gh release create "v${VN}-b${{ github.run_number }}" gridfix-debug.apk $EXTRA \
            --prerelease \
            --title "MGRS GPS v${VN} (build ${{ github.run_number }})" \
            --notes 'Archived build. The latest release is the one to install day to day.' || true

      - name: Fail the job if the build or the field-math tests failed
        if: steps.gradle.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "build=${{ steps.gradle.outcome }} tests=${{ steps.tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "--- failing tests ---"
            grep -A 4 -E "FAILED|AssertionError" test.log | tail -n 60 || true
          fi
          exit 1
